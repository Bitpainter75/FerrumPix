<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>FerrumPix</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0B0E11; }
  #stage { position: fixed; inset: 0; outline: none; touch-action: none; user-select: none; }
  #stage canvas { position: absolute; display: block; }
  /* Hochladen und Herunterladen. Farben wie das dunkle Erscheinungsbild der Anwendung. */
  .fp-layer { position: fixed; z-index: 10000; font: 13px/1.4 system-ui, sans-serif; color: #E7ECF0; }
  #drop { inset: 0; display: none; align-items: center; justify-content: center; pointer-events: none;
          background: rgba(11, 14, 17, 0.72); border: 3px dashed #F08A1A; box-sizing: border-box; font-size: 20px; }
  #drop.on { display: flex; }
  #panel { right: 16px; bottom: 16px; width: min(380px, calc(100vw - 32px)); max-height: 60vh; display: none;
           flex-direction: column; background: #192128; border: 1px solid #2A333C; border-radius: 10px;
           box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5); overflow: hidden; }
  #panel.on { display: flex; }
  #panel header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid #2A333C; }
  #panel header span { flex: 1; }
  #rows { overflow-y: auto; padding: 4px 0; }
  .row { padding: 6px 12px; }
  .row .name { display: flex; gap: 8px; }
  .row .name span:first-child { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .state { color: #9AA6B2; white-space: nowrap; }
  .row.failed .state { color: #F0603A; }
  .row.done .state { color: #6CC28A; }
  .bar { height: 3px; margin-top: 4px; background: #2A333C; border-radius: 2px; overflow: hidden; }
  .bar div { height: 100%; width: 0; background: #F08A1A; }
  #overall { margin: 0 12px 10px; }
  .fp-button { border: 1px solid #2A333C; border-radius: 6px; background: #0B0E11; color: #E7ECF0;
               padding: 4px 10px; font: inherit; cursor: pointer; }
  .fp-button.accent { background: #F08A1A; border-color: #F08A1A; color: #0B0E11; }
  #offers { right: 16px; top: 16px; display: flex; flex-direction: column; gap: 8px; width: min(380px, calc(100vw - 32px)); }
  .offer { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: #192128;
           border: 1px solid #2A333C; border-radius: 10px; box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5); }
  .offer span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Unverschluesselt im Heimnetz: ein dezenter Hinweis oben in der Mitte, ueber der Kopfleiste.
     Nach ein paar Sekunden tritt er zurueck, bleibt aber sichtbar. */
  #httpNotice { top: 6px; left: 50%; transform: translateX(-50%); display: none; align-items: center; gap: 6px;
                padding: 3px 10px; font-size: 12px; background: #192128; border: 1px solid #2A333C;
                border-radius: 999px; color: #E7ECF0; opacity: 0.9; transition: opacity 1.5s; white-space: nowrap;
                max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis; }
  #httpNotice.on { display: flex; }
  #httpNotice.quiet { opacity: 0.45; }
  #httpNotice:hover { opacity: 1; }
  #httpNotice svg { flex: none; color: #F08A1A; }
  /* Nimmt beim Einfuegen kurz den Fokus, damit jeder Browser das Ereignis paste schickt. */
  #clipSink { position: fixed; left: -10000px; top: 0; width: 1px; height: 1px; opacity: 0; }
</style>
</head>
<body>
<div id="stage" tabindex="0"></div>
<div id="drop" class="fp-layer"></div>
<input id="filePicker" type="file" multiple hidden>
<textarea id="clipSink" tabindex="-1" aria-hidden="true" autocomplete="off"></textarea>
<div id="panel" class="fp-layer">
  <header><span id="panelTitle"></span><button id="panelCancel" class="fp-button" type="button"></button><button id="panelClose" class="fp-button" type="button"></button></header>
  <div id="rows"></div>
  <div id="overall" class="bar"><div></div></div>
</div>
<div id="offers" class="fp-layer"></div>
<div id="httpNotice" class="fp-layer" role="status">
  <svg width="12" height="12" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M208 76h-84V56a28 28 0 0 1 54.39-9.37 12 12 0 1 0 22.62-8A52 52 0 0 0 100 56v20H48a20 20 0 0 0-20 20v112a20 20 0 0 0 20 20h160a20 20 0 0 0 20-20V96a20 20 0 0 0-20-20Zm-4 128H52V100h152Z"/></svg>
  <span></span>
</div>
<script>
'use strict';
// Die Gegenstelle zu Services/BrowserBridge*.vb. Je Fenster der Anwendung ein Canvas; der Server
// schickt Bildausschnitte, diese Seite schickt Maus, Tastatur und die Groesse des Tabs zurueck.
const stage = document.getElementById('stage');
const canvases = new Map();
let socket = null;
// Die Kennung dieser Seite. Der Server setzt sie beim Ausliefern ein und nimmt den WebSocket nur
// mit ihr an; eine Seite, die nicht von ihm stammt, hat keine.
const token = '__FERRUMPIX_TOKEN__';
// Bilder werden im Hintergrund dekodiert. Die Kette haelt die Reihenfolge fest, in der sie
// ankamen: ein verlustfreier Nachzug darf nicht von einem aelteren Ausschnitt uebermalt werden.
let chain = Promise.resolve();

function connect() {
  const scheme = location.protocol === 'https:' ? 'wss://' : 'ws://';
  socket = new WebSocket(scheme + location.host + '/ws');
  socket.binaryType = 'arraybuffer';
  socket.onopen = () => send({ t: 'hello', w: innerWidth, h: innerHeight, scale: devicePixelRatio || 1, token });
  socket.onmessage = event => {
    if (typeof event.data === 'string') onText(JSON.parse(event.data));
    else onImage(event.data);
  };
  socket.onclose = () => setTimeout(connect, 1000);
}

function send(message) {
  // Waehrend ein Einfuegen den Inhalt des Geraets hinueberbringt, warten Tasten und Maus: STRG+V
  // muss vor allem ankommen, was danach gedrueckt wurde (siehe "Zwischenablage").
  if (pasteHold && (message.t === 'k' || message.t === 'm')) {
    pasteHold.held.push(message);
    return;
  }
  if (socket && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify(message));
}

function onText(message) {
  if (message.t === 'windows') {
    chain = chain.then(() => layout(message));
  } else if (message.t === 'cursor') {
    stage.style.cursor = cursors[message.name] || 'default';
  } else if (message.t === 'offer') {
    showOffer(message);
  } else if (message.t === 'gone' || message.t === 'delivered') {
    dropOffer(message.id);
  } else if (message.t === 'interrupted') {
    reshowOffer(message.id);
  } else if (message.t === 'pick') {
    pickFiles();
  } else if (message.t === 'variant') {
    // Wechsel auf die andere Seite (Knopf "Mobile Ansicht" der Anwendung). Dieselbe Sitzung gilt
    // dort weiter; die Wahl merkt sich der Browser wie die des Anmeldefensters.
    const mobile = message.to === 'mobile';
    try { localStorage.setItem('ferrumpix.variant', mobile ? 'mobile' : 'desktop'); } catch (ignored) { }
    socket.onclose = null;
    location.assign(mobile ? '/m/' : '/');
  } else if (message.t === 'copy') {
    // Ein Text fuer die Zwischenablage dieses Geraets (Link zum Teilen aus der Galerie). Der
    // Klick, der ihn ausloeste, kam von hier; ohne Zwischenablage (HTTP im Heimnetz) zum Abschreiben.
    const text = String(message.text || '');
    const fallback = () => window.prompt('', text);
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).catch(fallback);
    else fallback();
  } else if (message.t === 'clip') {
    // Die Anwendung hat Text oder ein Bild abgelegt (siehe "Zwischenablage").
    onClip(message).catch(() => clipNotice(text('clipFailed')));
  } else if (message.t === 'reload') {
    // Die Kennung oder die Sitzung gilt nicht mehr: die Anwendung wurde neu gestartet oder
    // gesperrt. Neu laden holt eine frische Kennung oder, ohne Sitzung, das Anmeldefenster.
    socket.onclose = null;
    setTimeout(() => location.reload(), 1000);
  }
}

function layout(message) {
  const seen = new Set();
  for (const win of message.list) {
    seen.add(win.id);
    let canvas = canvases.get(win.id);
    if (!canvas) {
      canvas = document.createElement('canvas');
      stage.appendChild(canvas);
      canvases.set(win.id, canvas);
    }
    if (canvas.width !== win.w || canvas.height !== win.h) {
      canvas.width = win.w;
      canvas.height = win.h;
    }
    const scale = win.s || message.scale || 1;
    canvas.style.left = (win.x / scale) + 'px';
    canvas.style.top = (win.y / scale) + 'px';
    canvas.style.width = (win.w / scale) + 'px';
    canvas.style.height = (win.h / scale) + 'px';
    canvas.style.zIndex = win.z;
  }
  for (const [id, canvas] of canvases) {
    if (!seen.has(id)) {
      canvas.remove();
      canvases.delete(id);
    }
  }
}

function onImage(buffer) {
  const view = new DataView(buffer);
  if (view.getUint8(0) !== 1) return;
  const id = view.getInt32(1, true);
  const x = view.getInt32(5, true);
  const y = view.getInt32(9, true);
  const w = view.getInt32(13, true);
  const h = view.getInt32(17, true);
  const lossless = view.getUint8(21) === 1;
  const blob = new Blob([new Uint8Array(buffer, 22)], { type: lossless ? 'image/png' : 'image/jpeg' });
  const decoded = createImageBitmap(blob);
  chain = chain.then(() => decoded).then(bitmap => {
    const canvas = canvases.get(id);
    if (canvas) {
      const context = canvas.getContext('2d');
      if (lossless) context.clearRect(x, y, w, h);
      context.drawImage(bitmap, x, y);
    }
    bitmap.close();
  }).catch(() => {});
}

// Die Zeigerarten der Anwendung und ihre Entsprechung im Browser.
const cursors = {
  Arrow: 'default', Ibeam: 'text', Wait: 'wait', Cross: 'crosshair', UpArrow: 'default',
  SizeWestEast: 'ew-resize', SizeNorthSouth: 'ns-resize', SizeAll: 'move', No: 'not-allowed',
  Hand: 'pointer', AppStarting: 'progress', Help: 'help', TopSide: 'ns-resize', BottomSide: 'ns-resize',
  LeftSide: 'ew-resize', RightSide: 'ew-resize', TopLeftCorner: 'nwse-resize', BottomRightCorner: 'nwse-resize',
  TopRightCorner: 'nesw-resize', BottomLeftCorner: 'nesw-resize', DragMove: 'move', DragCopy: 'copy',
  DragLink: 'alias', None: 'none'
};

// Die Zahl entspricht den Eingabemerkern der Anwendung: Alt 1, Strg 2, Umschalt 4, Meta 8,
// linke Maustaste 16, rechte 32, mittlere 64.
function modifiers(event) {
  const buttons = event.buttons || 0;
  return (event.altKey ? 1 : 0) | (event.ctrlKey ? 2 : 0) | (event.shiftKey ? 4 : 0) | (event.metaKey ? 8 : 0) |
         ((buttons & 1) ? 16 : 0) | ((buttons & 2) ? 32 : 0) | ((buttons & 4) ? 64 : 0);
}

// Mausbewegungen kommen oefter, als ein Bild entsteht. Gesendet wird die letzte je Bildwechsel.
let pendingMove = null;
function flushMove() {
  if (pendingMove) {
    send(pendingMove);
    pendingMove = null;
  }
}
// EIN ZUG MIT GEDRUECKTER TASTE BEHAELT JEDEN PUNKT. Die Anwendung malt von Punkt zu Punkt; nur
// die letzte Stelle je Bildwechsel ergaebe aus einem Bogen ein Vieleck. Der Browser fasst mehrere
// Bewegungen zu einem Ereignis zusammen und haelt die einzelnen bereit (getCoalescedEvents), die
// gehen hier alle hinaus. Ausgelassen wird nur, was weniger als einen Punkt vom letzten gesendeten
// entfernt liegt: eine schnelle Maus meldet sich sonst tausendmal in der Sekunde.
let lastDragX = NaN;
let lastDragY = NaN;
function sendDrag(event) {
  const mods = modifiers(event);
  const points = event.getCoalescedEvents ? event.getCoalescedEvents() : [];
  const list = points.length > 0 ? points : [event];
  for (let index = 0; index < list.length; index++) {
    const x = list[index].clientX;
    const y = list[index].clientY;
    const isLast = index === list.length - 1;
    if (!isLast && Math.abs(x - lastDragX) < 1 && Math.abs(y - lastDragY) < 1) continue;
    lastDragX = x;
    lastDragY = y;
    send({ t: 'm', e: 'move', x, y, mods });
  }
}
stage.addEventListener('pointermove', event => {
  if (event.buttons) {
    flushMove();
    sendDrag(event);
    return;
  }
  const first = pendingMove === null;
  pendingMove = { t: 'm', e: 'move', x: event.clientX, y: event.clientY, mods: modifiers(event) };
  if (first) requestAnimationFrame(flushMove);
});
// EIN DRUCK OHNE LOSLASSEN WIRD AUFGEHOBEN, nicht losgelassen. Oeffnet sich waehrend des Drucks
// ein Dialog des Browsers (der Dateiwaehler, wenn ein Knopf schon beim Druecken ausloest), geht
// das Loslassen an ihn, und die Anwendung hielte den Knopf fuer weiter gedrueckt: jeder folgende
// Klick traefe wieder ihn. 'cancel' hebt den Druck auf, ohne zu klicken (BrowserBridge.CancelPointer).
let pointerHeld = false;
function cancelPointer() {
  if (!pointerHeld) return;
  pointerHeld = false;
  flushMove();
  send({ t: 'm', e: 'cancel' });
}
stage.addEventListener('pointerdown', event => {
  stage.focus();
  stage.setPointerCapture(event.pointerId);
  flushMove();
  lastDragX = event.clientX;
  lastDragY = event.clientY;
  pointerHeld = true;
  send({ t: 'm', e: 'down', x: event.clientX, y: event.clientY, b: event.button, mods: modifiers(event) });
  event.preventDefault();
});
stage.addEventListener('pointerup', event => {
  event.preventDefault();
  // Ein Loslassen ohne Druecken (der Druck ist aufgehoben, oder er begann ausserhalb) gehoert
  // niemandem in der Anwendung.
  if (!pointerHeld) return;
  pointerHeld = false;
  flushMove();
  send({ t: 'm', e: 'up', x: event.clientX, y: event.clientY, b: event.button, mods: modifiers(event) });
});
// Nach einem gewoehnlichen Loslassen ist der Druck schon vorbei, dann tun beide nichts.
stage.addEventListener('pointercancel', cancelPointer);
stage.addEventListener('lostpointercapture', cancelPointer);
addEventListener('blur', cancelPointer);
stage.addEventListener('wheel', event => {
  // Eine Raste des Mausrads sind im Browser rund hundert Punkte, in der Anwendung eine Einheit,
  // und die Richtung ist umgekehrt.
  const unit = event.deltaMode === 1 ? 3 : 100;
  send({ t: 'm', e: 'wheel', x: event.clientX, y: event.clientY,
         dx: -event.deltaX / unit, dy: -event.deltaY / unit, mods: modifiers(event) });
  event.preventDefault();
}, { passive: false });
stage.addEventListener('contextmenu', event => event.preventDefault());

function onKey(event, kind) {
  // F12 bleibt beim Browser, sonst kaeme niemand mehr an dessen Werkzeuge.
  if (event.key === 'F12') return;
  const message = { t: 'k', e: kind, code: event.code, key: event.key, mods: modifiers(event) };
  // Ein einzelnes Zeichen ist Text, solange keine Befehlstaste gehalten wird. AltGr meldet sich
  // unter Windows als Strg+Alt und ist trotzdem Text.
  const command = (event.ctrlKey || event.metaKey) && !event.getModifierState('AltGraph');
  if (kind === 'down' && event.key.length === 1 && !command) message.text = event.key;
  // STRG+C, STRG+X und STRG+V gehen zusaetzlich an die Zwischenablage dieses Geraets. Mit SHIFT
  // sind es die Anpassungen, die bleiben in der Anwendung.
  if (kind === 'down' && command && !event.shiftKey && !event.altKey && !event.repeat) {
    const letter = event.key.toLowerCase();
    if (letter === 'v' && !pasteHold) {
      // KEIN preventDefault: der Browser soll einfuegen und damit das Ereignis paste schicken.
      beginPaste(message);
      return;
    }
    if (letter === 'c' || letter === 'x') armCopy();
  }
  send(message);
  event.preventDefault();
}
stage.addEventListener('keydown', event => onKey(event, 'down'));
stage.addEventListener('keyup', event => onKey(event, 'up'));
// Hat das Feld fuer das Einfuegen gerade den Fokus, kommen die Tasten dort an.
const clipSink = document.getElementById('clipSink');
clipSink.addEventListener('keydown', event => onKey(event, 'down'));
clipSink.addEventListener('keyup', event => onKey(event, 'up'));

let resizeTimer = 0;
addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => send({ t: 'resize', w: innerWidth, h: innerHeight, scale: devicePixelRatio || 1 }), 150);
});

// DATEIEN HINAUF UND HINUNTER, die Gegenstelle zu Services/BrowserBridgeFiles.vb. Die Texte setzt
// der Server beim Ausliefern in der Sprache der Anwendung ein.
const texts = __FERRUMPIX_TEXTS__;
function text(id, ...values) {
  let result = texts[id] || id;
  values.forEach((value, index) => { result = result.split('{' + index + '}').join(String(value)); });
  return result;
}

const drop = document.getElementById('drop');
const filePicker = document.getElementById('filePicker');
const panel = document.getElementById('panel');
const panelTitle = document.getElementById('panelTitle');
const panelCancel = document.getElementById('panelCancel');
const panelClose = document.getElementById('panelClose');
const rows = document.getElementById('rows');
const overallBar = document.querySelector('#overall div');
const offers = document.getElementById('offers');
drop.textContent = text('dropHere');
panelCancel.textContent = text('cancel');
panelClose.textContent = text('close');

// Unverschluesselt im Heimnetz: den Hinweis setzt der Server nur in diesem Betrieb in die Texte.
if (texts.httpNotice) {
  const notice = document.getElementById('httpNotice');
  notice.querySelector('span').textContent = texts.httpNotice;
  notice.title = texts.httpNoticeDetail || '';
  notice.classList.add('on');
  setTimeout(() => notice.classList.add('quiet'), 8000);
}

// Abmelden hat keinen eigenen Knopf mehr: "Sperren" in der Galerie beendet alle Sitzungen.

// Ablegen auf der Seite. Der Browser oeffnete die Datei sonst selbst und verliesse die Anwendung;
// deshalb wird auch ein Ablegen von etwas anderem als Dateien abgefangen. Der Zaehler gleicht aus,
// dass dragleave bei jedem Wechsel zwischen Elementen kommt.
let dragDepth = 0;
function carriesFiles(event) {
  return event.dataTransfer && Array.from(event.dataTransfer.types || []).includes('Files');
}
addEventListener('dragenter', event => {
  event.preventDefault();
  if (!carriesFiles(event)) return;
  dragDepth++;
  drop.classList.add('on');
});
addEventListener('dragover', event => {
  event.preventDefault();
  if (event.dataTransfer) event.dataTransfer.dropEffect = carriesFiles(event) ? 'copy' : 'none';
});
addEventListener('dragleave', event => {
  if (!carriesFiles(event)) return;
  dragDepth = Math.max(0, dragDepth - 1);
  if (dragDepth === 0) drop.classList.remove('on');
});
addEventListener('drop', event => {
  event.preventDefault();
  dragDepth = 0;
  drop.classList.remove('on');
  if (!carriesFiles(event) || event.dataTransfer.files.length === 0) return;
  // Die Stelle zaehlt: auf der Flaeche des Editors wird das Bild eine Ebene an dieser Stelle.
  enqueue(event.dataTransfer.files, event.clientX, event.clientY);
});

// Ohne Ziehen (Tablet): "Hochladen" in der Galerie der Anwendung schickt 'pick', und hier
// oeffnet sich der Dateiwaehler des Browsers. Ohne Stelle, das Ziel ist der Ordner der Galerie.
// Der Browser oeffnet ihn nur in einer Geste des Nutzers. Der Klick auf den Knopf der Anwendung
// begann als pointerdown auf dem Canvas, und die Aktivierung daraus haelt einige Sekunden; die
// Nachricht kommt Millisekunden spaeter. Sagt der Browser, dass sie vorbei ist, steht statt dessen
// ein eigener Knopf da, dessen Klick wieder eine Geste ist.
// Das Ende der Auswahl geht an die Anwendung zurueck ('picked'), nach einer Wahl wie nach
// Abbrechen; bis dahin schickt sie kein neues 'pick'. Ein 'pick' kurz nach dem Schliessen wird
// verworfen: es kann nur aus dem Klick stammen, mit dem der Dialog zuging.
let pickerClosedAt = -Infinity;
function pickerClosed() {
  pickerClosedAt = performance.now();
  send({ t: 'picked' });
}
function pickFiles() {
  if (performance.now() - pickerClosedAt < 1000) {
    send({ t: 'picked' });
    return;
  }
  // Loest der Knopf schon beim Druecken aus, ist die Taste noch unten; das Loslassen geht
  // gleich an den Dialog.
  cancelPointer();
  const activation = navigator.userActivation;
  if (!activation || activation.isActive) {
    filePicker.click();
    return;
  }
  for (const old of Array.from(offers.querySelectorAll('.pick-offer'))) old.remove();
  const prompt = document.createElement('div');
  prompt.className = 'offer fp-layer pick-offer';
  prompt.style.position = 'static';
  const choose = document.createElement('button');
  choose.className = 'fp-button accent';
  choose.type = 'button';
  choose.textContent = text('upload');
  choose.addEventListener('click', () => { prompt.remove(); filePicker.click(); });
  const close = document.createElement('button');
  close.className = 'fp-button';
  close.type = 'button';
  close.textContent = text('close');
  close.addEventListener('click', () => { prompt.remove(); pickerClosed(); stage.focus(); });
  const label = document.createElement('span');
  prompt.append(label, choose, close);
  offers.appendChild(prompt);
  choose.focus();
}
filePicker.addEventListener('change', () => {
  pickerClosed();
  if (filePicker.files.length > 0) enqueue(filePicker.files, -1, -1);
  filePicker.value = '';
  stage.focus();
});
// Abbrechen meldet nur 'cancel' (Chrome ab 113, Firefox ab 91, Safari ab 16.4). Ohne das
// Ereignis gibt die Zeitgrenze der Anwendung den Weg wieder frei.
filePicker.addEventListener('cancel', () => {
  pickerClosed();
  stage.focus();
});

// Eine Datei nach der anderen, jede als eigene Anfrage. XMLHttpRequest statt fetch, weil nur
// dort der Fortschritt beim Senden zu sehen ist.
let queue = [];
let current = null;
let finished = 0;
let total = 0;
let bytesDone = 0;
let bytesTotal = 0;
function isSidecar(name) {
  return /\.(xmp|fpxmp)$/i.test(name);
}
function enqueue(fileList, x, y) {
  // Beistelldateien zuletzt: bekommt ein Bild einen anderen Namen, weil seiner belegt ist, folgt
  // seine Beistelldatei ihm nur, wenn das Bild schon angekommen ist.
  const files = Array.from(fileList).sort((a, b) => Number(isSidecar(a.name)) - Number(isSidecar(b.name)));
  const batch = Math.random().toString(36).slice(2) + Date.now().toString(36);
  files.forEach((file, index) => {
    queue.push({ file, x, y, index, batch, row: addRow(file) });
    total++;
    bytesTotal += file.size;
  });
  panel.classList.add('on');
  updatePanel();
  pump();
}
function addRow(file) {
  const row = document.createElement('div');
  row.className = 'row';
  const name = document.createElement('div');
  name.className = 'name';
  const label = document.createElement('span');
  label.textContent = file.name;
  const state = document.createElement('span');
  state.className = 'state';
  name.append(label, state);
  const bar = document.createElement('div');
  bar.className = 'bar';
  bar.appendChild(document.createElement('div'));
  row.append(name, bar);
  rows.appendChild(row);
  return row;
}
function setRow(row, kind, state) {
  row.classList.remove('done', 'failed');
  if (kind) row.classList.add(kind);
  row.querySelector('.state').textContent = state;
}
function updatePanel() {
  panelTitle.textContent = text('progress', finished, total);
  const loaded = current ? current.loaded : 0;
  overallBar.style.width = bytesTotal > 0 ? Math.min(100, (bytesDone + loaded) / bytesTotal * 100) + '%' : '0';
  const busy = current !== null || queue.length > 0;
  panelCancel.style.display = busy ? '' : 'none';
  panelClose.style.display = busy ? 'none' : '';
}
// Alles angekommen und nichts schiefgegangen: kurz "Hochgeladen", dann geht das Fenster. Mit
// einem Fehler bleibt es stehen, bis jemand Schliessen drueckt.
let hideTimer = 0;
function closePanel() {
  clearTimeout(hideTimer);
  panel.classList.remove('on');
  rows.textContent = '';
  finished = total = bytesDone = bytesTotal = 0;
}
function pump() {
  clearTimeout(hideTimer);
  if (current || queue.length === 0) {
    updatePanel();
    if (!current && queue.length === 0 && total > 0 && !rows.querySelector('.row.failed')) {
      panelTitle.textContent = text('done');
      hideTimer = setTimeout(closePanel, 2000);
    }
    return;
  }
  const item = queue.shift();
  // Auch eine zu grosse Datei geht als Anfrage hinaus: der Server weist sie am Kopf ab, bevor er
  // ein Byte liest, und merkt sich, dass dieses Bild des Ablegens nicht ankam. Seine
  // Beistelldatei landet sonst neben einem gleichnamigen anderen Bild im Ordner. Manche Browser
  // melden dabei nur einen Abbruch statt des Grundes; den Grund setzt deshalb die Seite.
  const tooLarge = item.file.size > Number(texts.maxBytes || Infinity);
  const request = new XMLHttpRequest();
  current = { item, request, loaded: 0 };
  const query = 'name=' + encodeURIComponent(item.file.name) + '&x=' + item.x + '&y=' + item.y +
                '&i=' + item.index + '&batch=' + encodeURIComponent(item.batch);
  request.open('POST', '/upload?' + query);
  request.setRequestHeader('X-FerrumPix-Token', token);
  request.setRequestHeader('Content-Type', 'application/octet-stream');
  const bar = item.row.querySelector('.bar div');
  request.upload.onprogress = event => {
    if (!event.lengthComputable) return;
    current.loaded = event.loaded;
    bar.style.width = (event.loaded / event.total * 100) + '%';
    updatePanel();
  };
  const finish = (kind, state) => {
    setRow(item.row, kind, state);
    bar.style.width = '100%';
    finished++;
    bytesDone += item.file.size;
    current = null;
    pump();
  };
  request.onload = () => {
    let answer = {};
    try { answer = JSON.parse(request.responseText); } catch (error) { }
    if (request.status === 200 && answer.ok) finish('done', text('done'));
    else finish('failed', answer.error || (tooLarge ? text('tooLarge') : text('failed')));
  };
  request.onerror = () => finish('failed', tooLarge ? text('tooLarge') : text('interrupted'));
  request.onabort = () => finish('failed', text('cancelled'));
  request.send(item.file);
  updatePanel();
}
panelCancel.addEventListener('click', () => {
  // Was noch wartet, faellt weg; die laufende Datei bricht ab, und der Server loescht ihre
  // Teildatei.
  for (const item of queue) {
    setRow(item.row, 'failed', text('cancelled'));
    finished++;
    bytesDone += item.file.size;
  }
  queue = [];
  if (current) current.request.abort();
  updatePanel();
  stage.focus();
});
panelClose.addEventListener('click', () => {
  closePanel();
  stage.focus();
});

// Ein Angebot der Anwendung zum Herunterladen. Die Seite kennt nur seine Kennung, nie einen
// Pfad. Kommt es aus dem Kontextmenue oder vom Ziel "Herunterladen", beginnt es gleich.
// Sobald der Download laeuft, tritt der Eintrag zurueck: ein Download ueber einen Verweis meldet
// der Seite kein Ende, das tut die Bruecke ("delivered", dann geht er ganz). Bricht er ab
// ("interrupted"), steht der Eintrag wieder da, mit dem Grund und dem Knopf fuer einen neuen Versuch.
function startDownload(id, name) {
  for (const entry of Array.from(offers.children)) {
    if (entry.dataset.offer === id) entry.style.display = 'none';
  }
  const link = document.createElement('a');
  link.href = '/download?id=' + encodeURIComponent(id) + '&token=' + encodeURIComponent(token);
  link.download = name;
  document.body.appendChild(link);
  link.click();
  link.remove();
}
// Ein Angebot aus einem eigenen Ordner der Anwendung (Ziel "Herunterladen") gilt nur bis zum
// fertigen Download; danach nimmt die Anwendung es zurueck, und sein Eintrag geht.
function dropOffer(id) {
  for (const entry of Array.from(offers.children)) {
    if (entry.dataset.offer === id) entry.remove();
  }
}
function reshowOffer(id) {
  for (const entry of Array.from(offers.children)) {
    if (entry.dataset.offer !== id) continue;
    entry.style.display = '';
    const label = entry.querySelector('span');
    label.textContent = entry.dataset.name + ': ' + text('interrupted');
  }
}
function showOffer(message) {
  const offer = document.createElement('div');
  offer.dataset.offer = message.id;
  offer.dataset.name = message.name;
  offer.className = 'offer fp-layer';
  offer.style.position = 'static';
  const label = document.createElement('span');
  label.textContent = message.name;
  label.title = text('ready');
  const get = document.createElement('button');
  get.className = 'fp-button accent';
  get.type = 'button';
  get.textContent = text('download');
  get.addEventListener('click', () => { startDownload(message.id, message.name); stage.focus(); });
  const close = document.createElement('button');
  close.className = 'fp-button';
  close.type = 'button';
  close.textContent = text('close');
  close.addEventListener('click', () => { offer.remove(); stage.focus(); });
  offer.append(label, get, close);
  offers.appendChild(offer);
  while (offers.children.length > 4) offers.firstElementChild.remove();
  if (message.start) startDownload(message.id, message.name);
}

// ZWISCHENABLAGE zwischen diesem Geraet und der Anwendung, die Gegenstelle zu
// Services/BrowserBridgeClipboard.vb. Die Anwendung hat ihre eigene Zwischenablage; was sie dort
// ablegt, meldet die Bruecke mit 'clip', und diese Seite holt Text und Bild ab und schreibt sie
// hier ins System. STRG+V liest umgekehrt das Ereignis paste und bringt Text oder Bild hinueber,
// BEVOR die Taste die Anwendung erreicht.
//
// DIE GESTE. Schreiben darf eine Seite nur auf eine Handlung hin. Chrome und Edge erlauben es der
// Seite mit dem Fokus ohnehin, Firefox einige Sekunden nach der Taste, das reicht fuer den Weg
// ueber den WebSocket. WebKit (Safari und jeder Browser auf iOS) schreibt nur im Ereignis selbst;
// dort legt schon der Tastendruck einen Eintrag mit Zusagen an (ClipboardItem mit Promise), den
// die Antwort der Anwendung fuellt. Scheitert das Schreiben trotzdem, steht ein Knopf da, dessen
// Klick wieder eine Geste ist.
//
// OHNE HTTPS gibt es die Schnittstelle nicht (nur in sicherem Kontext, also HTTPS oder
// localhost). Text geht dann ueber das Ereignis copy (execCommand), Bilder gar nicht; Einfuegen
// geht ueberall, das Ereignis paste braucht keinen sicheren Kontext.
const clipboardApi = window.isSecureContext && !!navigator.clipboard && typeof navigator.clipboard.write === 'function';
const holdsGesture = clipboardApi && typeof ClipboardItem === 'function' &&
                     /AppleWebKit/.test(navigator.userAgent) && !/(Chrome|Chromium|Edg|Firefox)\//.test(navigator.userAgent);
let copyGesture = null;
let pasteHold = null;
let insecureImageNoticed = false;
let pointerX = -1;
let pointerY = -1;
stage.addEventListener('pointermove', event => { pointerX = event.clientX; pointerY = event.clientY; });

// WAS DAS GERAET GERADE HAELT, soweit diese Seite es weiss: ein Fingerabdruck dessen, was sie
// zuletzt geschrieben oder eingefuegt hat. Bringt STRG+V genau das, hat sich im Geraet nichts
// getan, und die Anwendung fuegt ihren eigenen Inhalt ein; der ist reicher (eine kopierte
// Auswahl kennt ihre Lage, kopierte Dateien sind Dateien und kein Text). Nur was neu ist, geht
// hinueber. Der Fingerabdruck gilt fuer diesen Tab, auch ueber ein Neuladen hinweg.
let deviceClip = null;
try { deviceClip = sessionStorage.getItem('ferrumpix.clip'); } catch (ignored) { }
function rememberDeviceClip(signature) {
  deviceClip = signature;
  try { sessionStorage.setItem('ferrumpix.clip', signature); } catch (ignored) { }
}
function hashText(value) {
  let hash = 0x811c9dc5;
  for (let index = 0; index < value.length; index++) {
    hash ^= value.charCodeAt(index);
    hash = Math.imul(hash, 0x01000193);
  }
  return (hash >>> 0).toString(16) + '.' + value.length;
}
// Zeilenenden setzt jedes System anders; ein Bild kann der Browser beim Schreiben neu kodieren,
// seine Groesse bleibt.
function textSignature(value) { return 't:' + hashText(String(value).replace(/\r\n?/g, '\n')); }
function imageSignature(width, height) { return 'i:' + width + 'x' + height; }

function clipNotice(label, actionLabel, action) {
  for (const old of Array.from(offers.querySelectorAll('.clip-offer'))) old.remove();
  const note = document.createElement('div');
  note.className = 'offer fp-layer clip-offer';
  note.style.position = 'static';
  const span = document.createElement('span');
  span.textContent = label;
  span.title = label;
  note.appendChild(span);
  if (action) {
    const button = document.createElement('button');
    button.className = 'fp-button accent';
    button.type = 'button';
    button.textContent = actionLabel;
    button.addEventListener('click', () => { note.remove(); action(); stage.focus(); });
    note.appendChild(button);
  }
  const close = document.createElement('button');
  close.className = 'fp-button';
  close.type = 'button';
  close.textContent = text('close');
  close.addEventListener('click', () => { note.remove(); stage.focus(); });
  note.appendChild(close);
  offers.appendChild(note);
  if (!action) setTimeout(() => note.remove(), 6000);
}

function fetchClip(id, kind) {
  const address = '/clipboard?id=' + encodeURIComponent(id) + '&kind=' + kind + '&token=' + encodeURIComponent(token);
  return fetch(address, { cache: 'no-store', credentials: 'same-origin' }).then(response => {
    if (response.status === 413) throw new Error('large');
    if (!response.ok) throw new Error('failed');
    // Der Typ des Eintrags muss genau stimmen; der Kopf der Antwort traegt noch den Zeichensatz.
    return kind === 'text' ? response.text().then(value => ({ value, blob: new Blob([value], { type: 'text/plain' }) }))
                           : response.arrayBuffer().then(bytes => ({ blob: new Blob([bytes], { type: 'image/png' }) }));
  });
}

// Der Tastendruck selbst: nur in WebKit noetig, dort aber die einzige Gelegenheit.
function armCopy() {
  if (!holdsGesture) return;
  if (copyGesture) copyGesture.fail();
  const gesture = { done: false, content: null, parts: {} };
  const entry = {};
  for (const type of ['text/plain', 'image/png']) {
    entry[type] = new Promise((resolve, reject) => { gesture.parts[type] = { resolve, reject }; });
    entry[type].catch(() => { });
  }
  gesture.fail = () => {
    if (gesture.done) return;
    gesture.done = true;
    if (copyGesture === gesture) copyGesture = null;
    gesture.parts['text/plain'].reject(new Error('none'));
    gesture.parts['image/png'].reject(new Error('none'));
  };
  // Kommt nichts (die Anwendung hat nichts abgelegt), verfaellt der Eintrag still.
  gesture.timer = setTimeout(gesture.fail, 15000);
  copyGesture = gesture;
  navigator.clipboard.write([new ClipboardItem(entry)]).then(() => {
    if (gesture.content) rememberDeviceClip(gesture.content.signature);
  }).catch(() => {
    // Ein Text ohne Bild laesst den Eintrag scheitern (beide Arten stehen fest, bevor die
    // Anwendung antwortet); dann der Knopf.
    if (gesture.content) offerClip(gesture.content);
  });
}

async function onClip(message) {
  const gesture = copyGesture && !copyGesture.done ? copyGesture : null;
  if (gesture) {
    copyGesture = null;
    clearTimeout(gesture.timer);
  }
  if (message.large) clipNotice(text('clipTooLarge'));
  const wantsImage = !!message.image && clipboardApi;
  if (message.image && !clipboardApi && !insecureImageNoticed) {
    insecureImageNoticed = true;
    clipNotice(text('clipImageInsecure'));
  }
  if (!message.text && !wantsImage) {
    if (gesture) gesture.fail();
    return;
  }
  let content;
  try {
    const [textPart, imagePart] = await Promise.all([
      message.text ? fetchClip(message.id, 'text') : null,
      wantsImage ? fetchClip(message.id, 'image') : null]);
    content = {
      plain: textPart ? textPart.value : null,
      text: textPart ? textPart.blob : null,
      image: imagePart ? imagePart.blob : null,
      signature: imagePart ? imageSignature(message.w, message.h) : textSignature(textPart.value)
    };
  } catch (error) {
    if (gesture) gesture.fail();
    // Inzwischen ist etwas Neueres abgelegt: dazu kommt eine eigene Nachricht.
    if (error.message === 'large') clipNotice(text('clipTooLarge'));
    return;
  }
  if (gesture) {
    gesture.content = content;
    gesture.done = true;
    gesture.parts['text/plain'].resolve(content.text || new Blob([''], { type: 'text/plain' }));
    if (content.image) gesture.parts['image/png'].resolve(content.image);
    else gesture.parts['image/png'].reject(new Error('none'));
    return;
  }
  writeClip(content, false);
}

function writeClip(content, fromButton) {
  let writing;
  if (clipboardApi && content.image) {
    const entry = { 'image/png': content.image };
    if (content.text) entry['text/plain'] = content.text;
    writing = navigator.clipboard.write([new ClipboardItem(entry)]);
  } else if (clipboardApi) {
    writing = navigator.clipboard.writeText(content.plain);
  } else {
    writing = copyByEvent(content.plain) ? Promise.resolve() : Promise.reject(new Error('refused'));
  }
  writing.then(() => rememberDeviceClip(content.signature))
         .catch(() => fromButton ? clipNotice(text('clipFailed')) : offerClip(content));
}

// Ohne Schnittstelle: das Ereignis copy, das execCommand ausloest, nimmt den Text synchron an.
function copyByEvent(value) {
  if (value === null) return false;
  const put = event => {
    event.clipboardData.setData('text/plain', value);
    event.preventDefault();
  };
  document.addEventListener('copy', put, true);
  let done = false;
  try { done = document.execCommand('copy'); } catch (ignored) { }
  document.removeEventListener('copy', put, true);
  return done;
}

function offerClip(content) {
  clipNotice(text('clipReady'), text('clipCopy'), () => writeClip(content, true));
}

// STRG+V. Den Fokus bekommt kurz ein verstecktes Textfeld: nur in ein bearbeitbares Element
// schicken alle Browser das Ereignis paste. Bis dahin und bis der Inhalt drueben liegt, warten
// alle weiteren Eingaben (send); kommt kein paste, geht die Taste nach kurzer Zeit trotzdem.
function beginPaste(down) {
  const hold = { down, held: [], seen: false };
  hold.timer = setTimeout(() => finishPaste(hold, true), 400);
  pasteHold = hold;
  clipSink.value = '';
  clipSink.focus({ preventScroll: true });
}
function finishPaste(hold, forward) {
  if (pasteHold !== hold) return;
  clearTimeout(hold.timer);
  pasteHold = null;
  if (document.activeElement === clipSink) stage.focus();
  if (forward) send(hold.down);
  for (const message of hold.held) send(message);
}
addEventListener('paste', event => {
  const hold = pasteHold;
  if (!hold || hold.seen) return;
  hold.seen = true;
  clearTimeout(hold.timer);
  event.preventDefault();
  stage.focus();
  // Das Ereignis gibt seinen Inhalt nur jetzt heraus; die Dateien darin bleiben lesbar.
  const data = event.clipboardData;
  const plain = data ? data.getData('text/plain') : '';
  const files = data ? Array.from(data.files || []) : [];
  hold.timer = setTimeout(() => finishPaste(hold, true), 30000);
  pasteIntoApp(plain, files).then(forward => finishPaste(hold, forward), () => {
    clipNotice(text('pasteFailed'));
    finishPaste(hold, false);
  });
}, true);

// Bilddaten (Bildschirmfoto, "Bild kopieren") heissen in jedem Browser "image.png"; kopierte
// Dateien aus einem Dateimanager tragen ihren Namen.
function isImageData(files) {
  return files.length === 1 && /^image\//.test(files[0].type) && (!files[0].name || /^image\.[a-z0-9]+$/i.test(files[0].name));
}
function toPng(bitmap) {
  const canvas = document.createElement('canvas');
  canvas.width = bitmap.width;
  canvas.height = bitmap.height;
  canvas.getContext('2d').drawImage(bitmap, 0, 0);
  return new Promise((resolve, reject) => canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('png')), 'image/png'));
}

// Liefert, ob STRG+V danach an die Anwendung geht.
async function pasteIntoApp(plain, files) {
  // Kopierte Dateien werden hochgeladen, wie beim Ablegen an der Stelle der Maus: im Editor eine
  // Ebene, in der Galerie in den Ordner. STRG+V selbst entfaellt dann.
  if (files.length > 0 && !isImageData(files)) {
    const signature = 'f:' + hashText(files.map(file => file.name + '/' + file.size).join('|'));
    if (signature === deviceClip) return true;
    rememberDeviceClip(signature);
    enqueue(files, pointerX, pointerY);
    return false;
  }
  let body;
  let type;
  let signature;
  if (files.length > 0) {
    const bitmap = await createImageBitmap(files[0]);
    signature = imageSignature(bitmap.width, bitmap.height);
    if (signature === deviceClip) {
      bitmap.close();
      return true;
    }
    try {
      body = files[0].type === 'image/png' ? files[0] : await toPng(bitmap);
    } finally {
      bitmap.close();
    }
    type = 'image/png';
  } else if (plain) {
    signature = textSignature(plain);
    if (signature === deviceClip) return true;
    body = new Blob([plain], { type: 'text/plain' });
    type = 'text/plain;charset=utf-8';
  } else {
    return true;
  }
  const limit = Number(type === 'image/png' ? texts.clipImageBytes : texts.clipTextBytes) || Infinity;
  if (body.size > limit) {
    clipNotice(text('clipTooLarge'));
    return false;
  }
  const response = await fetch('/clipboard', {
    method: 'POST', body, credentials: 'same-origin',
    headers: { 'Content-Type': type, 'X-FerrumPix-Token': token }
  });
  if (!response.ok) {
    clipNotice(response.status === 413 ? text('clipTooLarge') : text('pasteFailed'));
    return false;
  }
  rememberDeviceClip(signature);
  return true;
}

stage.focus();
connect();
</script>
