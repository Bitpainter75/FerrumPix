<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>FerrumPix</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0B0E11; }
  #stage { position: fixed; inset: 0; outline: none; touch-action: none; user-select: none; }
  #stage canvas { position: absolute; display: block; }
  /* Hochladen und Herunterladen. Farben wie das dunkle Erscheinungsbild der Anwendung. */
  .fp-layer { position: fixed; z-index: 10000; font: 13px/1.4 system-ui, sans-serif; color: #E7ECF0; }
  #drop { inset: 0; display: none; align-items: center; justify-content: center; pointer-events: none;
          background: rgba(11, 14, 17, 0.72); border: 3px dashed #F08A1A; box-sizing: border-box; font-size: 20px; }
  #drop.on { display: flex; }
  #uploadButton { right: 0; top: 50%; transform: translateY(-50%); width: 26px; height: 52px; padding: 0;
                  border: 1px solid #2A333C; border-right: none; border-radius: 8px 0 0 8px; background: #192128;
                  color: #E7ECF0; opacity: 0.45; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  #uploadButton:hover, #uploadButton:focus-visible { opacity: 1; }
  /* Abmelden, nur mit Kennwort: unter dem Knopf zum Hochladen, in derselben Art. */
  #logoutButton { right: 0; top: calc(50% + 32px); width: 26px; height: 34px; padding: 0;
                  border: 1px solid #2A333C; border-right: none; border-radius: 8px 0 0 8px; background: #192128;
                  color: #E7ECF0; opacity: 0.45; cursor: pointer; display: none; align-items: center; justify-content: center; }
  #logoutButton.on { display: flex; }
  #logoutButton:hover, #logoutButton:focus-visible { opacity: 1; }
  #panel { right: 16px; bottom: 16px; width: min(380px, calc(100vw - 32px)); max-height: 60vh; display: none;
           flex-direction: column; background: #192128; border: 1px solid #2A333C; border-radius: 10px;
           box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5); overflow: hidden; }
  #panel.on { display: flex; }
  #panel header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid #2A333C; }
  #panel header span { flex: 1; }
  #rows { overflow-y: auto; padding: 4px 0; }
  .row { padding: 6px 12px; }
  .row .name { display: flex; gap: 8px; }
  .row .name span:first-child { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .state { color: #9AA6B2; white-space: nowrap; }
  .row.failed .state { color: #F0603A; }
  .row.done .state { color: #6CC28A; }
  .bar { height: 3px; margin-top: 4px; background: #2A333C; border-radius: 2px; overflow: hidden; }
  .bar div { height: 100%; width: 0; background: #F08A1A; }
  #overall { margin: 0 12px 10px; }
  .fp-button { border: 1px solid #2A333C; border-radius: 6px; background: #0B0E11; color: #E7ECF0;
               padding: 4px 10px; font: inherit; cursor: pointer; }
  .fp-button.accent { background: #F08A1A; border-color: #F08A1A; color: #0B0E11; }
  #offers { right: 16px; top: 16px; display: flex; flex-direction: column; gap: 8px; width: min(380px, calc(100vw - 32px)); }
  .offer { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: #192128;
           border: 1px solid #2A333C; border-radius: 10px; box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5); }
  .offer span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Unverschluesselt im Heimnetz: ein dezenter Hinweis oben in der Mitte, ueber der Kopfleiste.
     Nach ein paar Sekunden tritt er zurueck, bleibt aber sichtbar. */
  #httpNotice { top: 6px; left: 50%; transform: translateX(-50%); display: none; align-items: center; gap: 6px;
                padding: 3px 10px; font-size: 12px; background: #192128; border: 1px solid #2A333C;
                border-radius: 999px; color: #E7ECF0; opacity: 0.9; transition: opacity 1.5s; white-space: nowrap;
                max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis; }
  #httpNotice.on { display: flex; }
  #httpNotice.quiet { opacity: 0.45; }
  #httpNotice:hover { opacity: 1; }
  #httpNotice svg { flex: none; color: #F08A1A; }
</style>
</head>
<body>
<div id="stage" tabindex="0"></div>
<div id="drop" class="fp-layer"></div>
<button id="uploadButton" class="fp-layer" type="button">
  <svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M228 152v56a20 20 0 0 1-20 20H48a20 20 0 0 1-20-20v-56a12 12 0 0 1 24 0v52h152v-52a12 12 0 0 1 24 0ZM96.49 88.49 116 69v83a12 12 0 0 0 24 0V69l19.51 19.52a12 12 0 1 0 17-17l-40-40a12 12 0 0 0-17 0l-40 40a12 12 0 1 0 17 17Z"/></svg>
</button>
<button id="logoutButton" class="fp-layer" type="button">
  <svg width="14" height="14" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M116 216a12 12 0 0 1-12 12H48a20 20 0 0 1-20-20V48a20 20 0 0 1 20-20h56a12 12 0 0 1 0 24H52v152h52a12 12 0 0 1 12 12Zm108.49-96.49-40-40a12 12 0 0 0-17 17L187 116h-83a12 12 0 0 0 0 24h83l-19.52 19.51a12 12 0 0 0 17 17l40-40a12 12 0 0 0 .01-17Z"/></svg>
</button>
<input id="filePicker" type="file" multiple hidden>
<div id="panel" class="fp-layer">
  <header><span id="panelTitle"></span><button id="panelCancel" class="fp-button" type="button"></button><button id="panelClose" class="fp-button" type="button"></button></header>
  <div id="rows"></div>
  <div id="overall" class="bar"><div></div></div>
</div>
<div id="offers" class="fp-layer"></div>
<div id="httpNotice" class="fp-layer" role="status">
  <svg width="12" height="12" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M208 76h-84V56a28 28 0 0 1 54.39-9.37 12 12 0 1 0 22.62-8A52 52 0 0 0 100 56v20H48a20 20 0 0 0-20 20v112a20 20 0 0 0 20 20h160a20 20 0 0 0 20-20V96a20 20 0 0 0-20-20Zm-4 128H52V100h152Z"/></svg>
  <span></span>
</div>
<script>
'use strict';
// Die Gegenstelle zu Services/BrowserBridge*.vb. Je Fenster der Anwendung ein Canvas; der Server
// schickt Bildausschnitte, diese Seite schickt Maus, Tastatur und die Groesse des Tabs zurueck.
const stage = document.getElementById('stage');
const canvases = new Map();
let socket = null;
// Die Kennung dieser Seite. Der Server setzt sie beim Ausliefern ein und nimmt den WebSocket nur
// mit ihr an; eine Seite, die nicht von ihm stammt, hat keine.
const token = '__FERRUMPIX_TOKEN__';
// Bilder werden im Hintergrund dekodiert. Die Kette haelt die Reihenfolge fest, in der sie
// ankamen: ein verlustfreier Nachzug darf nicht von einem aelteren Ausschnitt uebermalt werden.
let chain = Promise.resolve();

function connect() {
  const scheme = location.protocol === 'https:' ? 'wss://' : 'ws://';
  socket = new WebSocket(scheme + location.host + '/ws');
  socket.binaryType = 'arraybuffer';
  socket.onopen = () => send({ t: 'hello', w: innerWidth, h: innerHeight, scale: devicePixelRatio || 1, token });
  socket.onmessage = event => {
    if (typeof event.data === 'string') onText(JSON.parse(event.data));
    else onImage(event.data);
  };
  socket.onclose = () => setTimeout(connect, 1000);
}

function send(message) {
  if (socket && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify(message));
}

function onText(message) {
  if (message.t === 'windows') {
    chain = chain.then(() => layout(message));
  } else if (message.t === 'cursor') {
    stage.style.cursor = cursors[message.name] || 'default';
  } else if (message.t === 'offer') {
    showOffer(message);
  } else if (message.t === 'reload') {
    // Die Kennung oder die Sitzung gilt nicht mehr: die Anwendung wurde neu gestartet oder
    // gesperrt. Neu laden holt eine frische Kennung oder, ohne Sitzung, das Anmeldefenster.
    socket.onclose = null;
    setTimeout(() => location.reload(), 1000);
  }
}

function layout(message) {
  const seen = new Set();
  for (const win of message.list) {
    seen.add(win.id);
    let canvas = canvases.get(win.id);
    if (!canvas) {
      canvas = document.createElement('canvas');
      stage.appendChild(canvas);
      canvases.set(win.id, canvas);
    }
    if (canvas.width !== win.w || canvas.height !== win.h) {
      canvas.width = win.w;
      canvas.height = win.h;
    }
    const scale = win.s || message.scale || 1;
    canvas.style.left = (win.x / scale) + 'px';
    canvas.style.top = (win.y / scale) + 'px';
    canvas.style.width = (win.w / scale) + 'px';
    canvas.style.height = (win.h / scale) + 'px';
    canvas.style.zIndex = win.z;
  }
  for (const [id, canvas] of canvases) {
    if (!seen.has(id)) {
      canvas.remove();
      canvases.delete(id);
    }
  }
}

function onImage(buffer) {
  const view = new DataView(buffer);
  if (view.getUint8(0) !== 1) return;
  const id = view.getInt32(1, true);
  const x = view.getInt32(5, true);
  const y = view.getInt32(9, true);
  const w = view.getInt32(13, true);
  const h = view.getInt32(17, true);
  const lossless = view.getUint8(21) === 1;
  const blob = new Blob([new Uint8Array(buffer, 22)], { type: lossless ? 'image/png' : 'image/jpeg' });
  const decoded = createImageBitmap(blob);
  chain = chain.then(() => decoded).then(bitmap => {
    const canvas = canvases.get(id);
    if (canvas) {
      const context = canvas.getContext('2d');
      if (lossless) context.clearRect(x, y, w, h);
      context.drawImage(bitmap, x, y);
    }
    bitmap.close();
  }).catch(() => {});
}

// Die Zeigerarten der Anwendung und ihre Entsprechung im Browser.
const cursors = {
  Arrow: 'default', Ibeam: 'text', Wait: 'wait', Cross: 'crosshair', UpArrow: 'default',
  SizeWestEast: 'ew-resize', SizeNorthSouth: 'ns-resize', SizeAll: 'move', No: 'not-allowed',
  Hand: 'pointer', AppStarting: 'progress', Help: 'help', TopSide: 'ns-resize', BottomSide: 'ns-resize',
  LeftSide: 'ew-resize', RightSide: 'ew-resize', TopLeftCorner: 'nwse-resize', BottomRightCorner: 'nwse-resize',
  TopRightCorner: 'nesw-resize', BottomLeftCorner: 'nesw-resize', DragMove: 'move', DragCopy: 'copy',
  DragLink: 'alias', None: 'none'
};

// Die Zahl entspricht den Eingabemerkern der Anwendung: Alt 1, Strg 2, Umschalt 4, Meta 8,
// linke Maustaste 16, rechte 32, mittlere 64.
function modifiers(event) {
  const buttons = event.buttons || 0;
  return (event.altKey ? 1 : 0) | (event.ctrlKey ? 2 : 0) | (event.shiftKey ? 4 : 0) | (event.metaKey ? 8 : 0) |
         ((buttons & 1) ? 16 : 0) | ((buttons & 2) ? 32 : 0) | ((buttons & 4) ? 64 : 0);
}

// Mausbewegungen kommen oefter, als ein Bild entsteht. Gesendet wird die letzte je Bildwechsel.
let pendingMove = null;
function flushMove() {
  if (pendingMove) {
    send(pendingMove);
    pendingMove = null;
  }
}
// EIN ZUG MIT GEDRUECKTER TASTE BEHAELT JEDEN PUNKT. Die Anwendung malt von Punkt zu Punkt; nur
// die letzte Stelle je Bildwechsel ergaebe aus einem Bogen ein Vieleck. Der Browser fasst mehrere
// Bewegungen zu einem Ereignis zusammen und haelt die einzelnen bereit (getCoalescedEvents), die
// gehen hier alle hinaus. Ausgelassen wird nur, was weniger als einen Punkt vom letzten gesendeten
// entfernt liegt: eine schnelle Maus meldet sich sonst tausendmal in der Sekunde.
let lastDragX = NaN;
let lastDragY = NaN;
function sendDrag(event) {
  const mods = modifiers(event);
  const points = event.getCoalescedEvents ? event.getCoalescedEvents() : [];
  const list = points.length > 0 ? points : [event];
  for (let index = 0; index < list.length; index++) {
    const x = list[index].clientX;
    const y = list[index].clientY;
    const isLast = index === list.length - 1;
    if (!isLast && Math.abs(x - lastDragX) < 1 && Math.abs(y - lastDragY) < 1) continue;
    lastDragX = x;
    lastDragY = y;
    send({ t: 'm', e: 'move', x, y, mods });
  }
}
stage.addEventListener('pointermove', event => {
  if (event.buttons) {
    flushMove();
    sendDrag(event);
    return;
  }
  const first = pendingMove === null;
  pendingMove = { t: 'm', e: 'move', x: event.clientX, y: event.clientY, mods: modifiers(event) };
  if (first) requestAnimationFrame(flushMove);
});
stage.addEventListener('pointerdown', event => {
  stage.focus();
  stage.setPointerCapture(event.pointerId);
  flushMove();
  lastDragX = event.clientX;
  lastDragY = event.clientY;
  send({ t: 'm', e: 'down', x: event.clientX, y: event.clientY, b: event.button, mods: modifiers(event) });
  event.preventDefault();
});
stage.addEventListener('pointerup', event => {
  flushMove();
  send({ t: 'm', e: 'up', x: event.clientX, y: event.clientY, b: event.button, mods: modifiers(event) });
  event.preventDefault();
});
stage.addEventListener('wheel', event => {
  // Eine Raste des Mausrads sind im Browser rund hundert Punkte, in der Anwendung eine Einheit,
  // und die Richtung ist umgekehrt.
  const unit = event.deltaMode === 1 ? 3 : 100;
  send({ t: 'm', e: 'wheel', x: event.clientX, y: event.clientY,
         dx: -event.deltaX / unit, dy: -event.deltaY / unit, mods: modifiers(event) });
  event.preventDefault();
}, { passive: false });
stage.addEventListener('contextmenu', event => event.preventDefault());

function onKey(event, kind) {
  // F12 bleibt beim Browser, sonst kaeme niemand mehr an dessen Werkzeuge.
  if (event.key === 'F12') return;
  const message = { t: 'k', e: kind, code: event.code, key: event.key, mods: modifiers(event) };
  // Ein einzelnes Zeichen ist Text, solange keine Befehlstaste gehalten wird. AltGr meldet sich
  // unter Windows als Strg+Alt und ist trotzdem Text.
  const command = (event.ctrlKey || event.metaKey) && !event.getModifierState('AltGraph');
  if (kind === 'down' && event.key.length === 1 && !command) message.text = event.key;
  send(message);
  event.preventDefault();
}
stage.addEventListener('keydown', event => onKey(event, 'down'));
stage.addEventListener('keyup', event => onKey(event, 'up'));

let resizeTimer = 0;
addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => send({ t: 'resize', w: innerWidth, h: innerHeight, scale: devicePixelRatio || 1 }), 150);
});

// DATEIEN HINAUF UND HINUNTER, die Gegenstelle zu Services/BrowserBridgeFiles.vb. Die Texte setzt
// der Server beim Ausliefern in der Sprache der Anwendung ein.
const texts = __FERRUMPIX_TEXTS__;
function text(id, ...values) {
  let result = texts[id] || id;
  values.forEach((value, index) => { result = result.split('{' + index + '}').join(String(value)); });
  return result;
}

const drop = document.getElementById('drop');
const uploadButton = document.getElementById('uploadButton');
const filePicker = document.getElementById('filePicker');
const panel = document.getElementById('panel');
const panelTitle = document.getElementById('panelTitle');
const panelCancel = document.getElementById('panelCancel');
const panelClose = document.getElementById('panelClose');
const rows = document.getElementById('rows');
const overallBar = document.querySelector('#overall div');
const offers = document.getElementById('offers');
drop.textContent = text('dropHere');
uploadButton.title = text('upload');
uploadButton.setAttribute('aria-label', text('upload'));
panelCancel.textContent = text('cancel');
panelClose.textContent = text('close');

// Unverschluesselt im Heimnetz: den Hinweis setzt der Server nur in diesem Betrieb in die Texte.
if (texts.httpNotice) {
  const notice = document.getElementById('httpNotice');
  notice.querySelector('span').textContent = texts.httpNotice;
  notice.title = texts.httpNoticeDetail || '';
  notice.classList.add('on');
  setTimeout(() => notice.classList.add('quiet'), 8000);
}

// Abmelden: beendet die Sitzung dieses Browsers, die anderen bleiben angemeldet. Den Text gibt
// es nur mit Kennwort; ohne bleibt der Knopf verborgen.
if (texts.logout) {
  const logoutButton = document.getElementById('logoutButton');
  logoutButton.title = texts.logout;
  logoutButton.setAttribute('aria-label', texts.logout);
  logoutButton.classList.add('on');
  logoutButton.addEventListener('click', async () => {
    try {
      await fetch('/logout', { method: 'POST', credentials: 'same-origin', cache: 'no-store' });
    } catch (ignored) { }
    if (socket) socket.onclose = null;
    location.replace('/');
  });
}

// Ablegen auf der Seite. Der Browser oeffnete die Datei sonst selbst und verliesse die Anwendung;
// deshalb wird auch ein Ablegen von etwas anderem als Dateien abgefangen. Der Zaehler gleicht aus,
// dass dragleave bei jedem Wechsel zwischen Elementen kommt.
let dragDepth = 0;
function carriesFiles(event) {
  return event.dataTransfer && Array.from(event.dataTransfer.types || []).includes('Files');
}
addEventListener('dragenter', event => {
  event.preventDefault();
  if (!carriesFiles(event)) return;
  dragDepth++;
  drop.classList.add('on');
});
addEventListener('dragover', event => {
  event.preventDefault();
  if (event.dataTransfer) event.dataTransfer.dropEffect = carriesFiles(event) ? 'copy' : 'none';
});
addEventListener('dragleave', event => {
  if (!carriesFiles(event)) return;
  dragDepth = Math.max(0, dragDepth - 1);
  if (dragDepth === 0) drop.classList.remove('on');
});
addEventListener('drop', event => {
  event.preventDefault();
  dragDepth = 0;
  drop.classList.remove('on');
  if (!carriesFiles(event) || event.dataTransfer.files.length === 0) return;
  // Die Stelle zaehlt: auf der Flaeche des Editors wird das Bild eine Ebene an dieser Stelle.
  enqueue(event.dataTransfer.files, event.clientX, event.clientY);
});

// Ohne Ziehen (Tablet): der Dateiwaehler des Browsers. Ohne Stelle, das Ziel ist der Ordner.
uploadButton.addEventListener('click', () => filePicker.click());
filePicker.addEventListener('change', () => {
  if (filePicker.files.length > 0) enqueue(filePicker.files, -1, -1);
  filePicker.value = '';
  stage.focus();
});

// Eine Datei nach der anderen, jede als eigene Anfrage. XMLHttpRequest statt fetch, weil nur
// dort der Fortschritt beim Senden zu sehen ist.
let queue = [];
let current = null;
let finished = 0;
let total = 0;
let bytesDone = 0;
let bytesTotal = 0;
function isSidecar(name) {
  return /\.(xmp|fpxmp)$/i.test(name);
}
function enqueue(fileList, x, y) {
  // Beistelldateien zuletzt: bekommt ein Bild einen anderen Namen, weil seiner belegt ist, folgt
  // seine Beistelldatei ihm nur, wenn das Bild schon angekommen ist.
  const files = Array.from(fileList).sort((a, b) => Number(isSidecar(a.name)) - Number(isSidecar(b.name)));
  const batch = Math.random().toString(36).slice(2) + Date.now().toString(36);
  files.forEach((file, index) => {
    queue.push({ file, x, y, index, batch, row: addRow(file) });
    total++;
    bytesTotal += file.size;
  });
  panel.classList.add('on');
  updatePanel();
  pump();
}
function addRow(file) {
  const row = document.createElement('div');
  row.className = 'row';
  const name = document.createElement('div');
  name.className = 'name';
  const label = document.createElement('span');
  label.textContent = file.name;
  const state = document.createElement('span');
  state.className = 'state';
  name.append(label, state);
  const bar = document.createElement('div');
  bar.className = 'bar';
  bar.appendChild(document.createElement('div'));
  row.append(name, bar);
  rows.appendChild(row);
  return row;
}
function setRow(row, kind, state) {
  row.classList.remove('done', 'failed');
  if (kind) row.classList.add(kind);
  row.querySelector('.state').textContent = state;
}
function updatePanel() {
  panelTitle.textContent = text('progress', finished, total);
  const loaded = current ? current.loaded : 0;
  overallBar.style.width = bytesTotal > 0 ? Math.min(100, (bytesDone + loaded) / bytesTotal * 100) + '%' : '0';
  const busy = current !== null || queue.length > 0;
  panelCancel.style.display = busy ? '' : 'none';
  panelClose.style.display = busy ? 'none' : '';
}
function pump() {
  if (current || queue.length === 0) {
    updatePanel();
    return;
  }
  const item = queue.shift();
  // Auch eine zu grosse Datei geht als Anfrage hinaus: der Server weist sie am Kopf ab, bevor er
  // ein Byte liest, und merkt sich, dass dieses Bild des Ablegens nicht ankam. Seine
  // Beistelldatei landet sonst neben einem gleichnamigen anderen Bild im Ordner. Manche Browser
  // melden dabei nur einen Abbruch statt des Grundes; den Grund setzt deshalb die Seite.
  const tooLarge = item.file.size > Number(texts.maxBytes || Infinity);
  const request = new XMLHttpRequest();
  current = { item, request, loaded: 0 };
  const query = 'name=' + encodeURIComponent(item.file.name) + '&x=' + item.x + '&y=' + item.y +
                '&i=' + item.index + '&batch=' + encodeURIComponent(item.batch);
  request.open('POST', '/upload?' + query);
  request.setRequestHeader('X-FerrumPix-Token', token);
  request.setRequestHeader('Content-Type', 'application/octet-stream');
  const bar = item.row.querySelector('.bar div');
  request.upload.onprogress = event => {
    if (!event.lengthComputable) return;
    current.loaded = event.loaded;
    bar.style.width = (event.loaded / event.total * 100) + '%';
    updatePanel();
  };
  const finish = (kind, state) => {
    setRow(item.row, kind, state);
    bar.style.width = '100%';
    finished++;
    bytesDone += item.file.size;
    current = null;
    pump();
  };
  request.onload = () => {
    let answer = {};
    try { answer = JSON.parse(request.responseText); } catch (error) { }
    if (request.status === 200 && answer.ok) finish('done', text('done'));
    else finish('failed', answer.error || (tooLarge ? text('tooLarge') : text('failed')));
  };
  request.onerror = () => finish('failed', tooLarge ? text('tooLarge') : text('interrupted'));
  request.onabort = () => finish('failed', text('cancelled'));
  request.send(item.file);
  updatePanel();
}
panelCancel.addEventListener('click', () => {
  // Was noch wartet, faellt weg; die laufende Datei bricht ab, und der Server loescht ihre
  // Teildatei.
  for (const item of queue) {
    setRow(item.row, 'failed', text('cancelled'));
    finished++;
    bytesDone += item.file.size;
  }
  queue = [];
  if (current) current.request.abort();
  updatePanel();
  stage.focus();
});
panelClose.addEventListener('click', () => {
  panel.classList.remove('on');
  rows.textContent = '';
  finished = total = bytesDone = bytesTotal = 0;
  stage.focus();
});

// Ein Angebot der Anwendung zum Herunterladen. Die Seite kennt nur seine Kennung, nie einen
// Pfad. Kommt es aus dem Kontextmenue, beginnt es gleich; der Knopf bleibt fuer ein zweites Mal.
function startDownload(id, name) {
  const link = document.createElement('a');
  link.href = '/download?id=' + encodeURIComponent(id) + '&token=' + encodeURIComponent(token);
  link.download = name;
  document.body.appendChild(link);
  link.click();
  link.remove();
}
function showOffer(message) {
  const offer = document.createElement('div');
  offer.className = 'offer fp-layer';
  offer.style.position = 'static';
  const label = document.createElement('span');
  label.textContent = message.name;
  label.title = text('ready');
  const get = document.createElement('button');
  get.className = 'fp-button accent';
  get.type = 'button';
  get.textContent = text('download');
  get.addEventListener('click', () => { startDownload(message.id, message.name); stage.focus(); });
  const close = document.createElement('button');
  close.className = 'fp-button';
  close.type = 'button';
  close.textContent = text('close');
  close.addEventListener('click', () => { offer.remove(); stage.focus(); });
  offer.append(label, get, close);
  offers.appendChild(offer);
  while (offers.children.length > 4) offers.firstElementChild.remove();
  if (message.start) startDownload(message.id, message.name);
}

stage.focus();
connect();
</script>
</body>
</html>
