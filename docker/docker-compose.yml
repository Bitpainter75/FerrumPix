# FerrumPix in the browser for all your devices: the app with Caddy in front as a reverse proxy
# with HTTPS, both in a network of their own. A template to copy; README.md next to it explains
# every step.
#
# SETUP
# 1. Put next to this file:
#      Caddyfile    included next to this file
#      .env         FERRUMPIX_DOMAIN=photos.example.org
#                   FERRUMPIX_PHOTOS=/path/to/photos
#      data/        an empty folder for everything FerrumPix keeps, owned by user id 1000:
#                   mkdir data; sudo chown 1000 data
# 2. docker compose up -d
# 3. Open https://<FERRUMPIX_DOMAIN> yourself right after the start. The first visit is the setup:
#    a user name, an email address if you like (for Forgot your password) and the password twice,
#    at least 8 characters with an uppercase and a lowercase letter, a digit and a special
#    character. Whoever opens the page first becomes the administrator. There is no password in
#    this file or in .env.
#
# AFTERWARDS
# - Further users, their rights per folder, the mail server for Forgot your password and the
#   public address for links: Settings, User management, in the full desktop interface.
# - Photo folders: one line per folder under "volumes", each below /photos. FerrumPix shows only
#   /photos; FERRUMPIX_FOLDER_ROOTS below changes that.
# - Update: docker compose pull, then docker compose up -d. The image follows :latest; for a fixed
#   version put FERRUMPIX_IMAGE=ghcr.io/bitpainter75/ferrumpix:<version> into .env.
# - The image checks its own health, so "docker compose ps" shows "healthy" once it is up.
# - Language and date format of the first start: FERRUMPIX_LANG in .env, for example
#   de_DE.UTF-8; later it can be changed in Settings.
# - Local time: the image runs on UTC. Uncomment TZ under "environment" and set your time zone,
#   for example Europe/Berlin.
#
# WHAT THIS TEMPLATE MAKES SURE OF:
# - FerrumPix publishes NO port. It is only reachable in the network "ferrumpix", and there it
#   only accepts what comes from the fixed address of the proxy (FERRUMPIX_BROWSER_PROXY_ADDRESS)
#   and is marked as encrypted by it. Whoever talks to FerrumPix past the proxy, even from this
#   computer over its address in the network, gets 403 and never sees the sign-in page.
# - FERRUMPIX_BROWSER_LOCAL_FORWARD is deliberately missing here. It promises "the port is only
#   open on this computer" and switches off the check of the sender; it belongs to the local
#   template only (docker-compose.local.yml).
#
# The addresses 172.30.145.0/24 are chosen freely. If another network on this computer already
# uses them, change all three places together (the subnet, the address of the proxy and the
# address in the environment).

name: ferrumpix

services:
  ferrumpix:
    image: "${FERRUMPIX_IMAGE:-ghcr.io/bitpainter75/ferrumpix:latest}"
    restart: unless-stopped
    environment:
      FERRUMPIX_BROWSER_TLS_PROXY: "1"
      FERRUMPIX_BROWSER_PROXY_ADDRESS: "172.30.145.2"
      LANG: "${FERRUMPIX_LANG:-C.UTF-8}"
      # Local time (the image runs on UTC):
      # TZ: "Europe/Berlin"
      # The image sets /photos. Only for folders outside it, several separated by ":":
      # FERRUMPIX_FOLDER_ROOTS: "/photos:/archive"
      # NVIDIA only, together with the NVIDIA block below:
      # NVIDIA_DRIVER_CAPABILITIES: graphics,compute,utility
    volumes:
      # Settings, catalog, thumbnails and downloaded models. Own fonts go to
      # ./data/share/FerrumPix/Fonts, there is no separate folder for them.
      - ./data:/data
      # Every photo folder below /photos, one line each, for example:
      - "${FERRUMPIX_PHOTOS:?FERRUMPIX_PHOTOS is missing in .env}:/photos/Pictures"
      # - /srv/archive:/photos/Archive
    # GRAPHICS CARD FOR THE MODELS (optional; without it the models run on the processor).
    # Intel or AMD: uncomment these lines. FERRUMPIX_RENDER_GID is the group of the render device
    # on this computer: stat -c %g /dev/dri/renderD128
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "${FERRUMPIX_RENDER_GID:-render}"
    # NVIDIA: needs the NVIDIA Container Toolkit on this computer. Uncomment these lines and
    # NVIDIA_DRIVER_CAPABILITIES above. With a recent Compose, "gpus: all" does the same.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    networks:
      ferrumpix:
        ipv4_address: 172.30.145.3

  caddy:
    image: docker.io/library/caddy:2
    restart: unless-stopped
    depends_on:
      ferrumpix:
        condition: service_healthy
    environment:
      FERRUMPIX_DOMAIN: "${FERRUMPIX_DOMAIN:?FERRUMPIX_DOMAIN is missing in .env}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      ferrumpix:
        ipv4_address: 172.30.145.2

networks:
  ferrumpix:
    ipam:
      config:
        - subnet: 172.30.145.0/24

volumes:
  caddy-data:
  caddy-config:
