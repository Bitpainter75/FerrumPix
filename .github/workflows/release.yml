# Vorlage. Gehoert ins OEFFENTLICHE Repo nach .github/workflows/release.yml
#
# Warum dort und nicht ins private packaging-Repo: Actions-Minuten sind fuer oeffentliche Repos
# frei, fuer private werden sie gegen das Monatskontingent gerechnet. Ein voller Lauf ueber alle
# Plattformen ist nicht kurz.
#
# DER FLATPAK GEHOERT NICHT MEHR HIERHER, er hat einen eigenen Lauf: flatpak-only.yml. Wird eine
# Version veroeffentlicht, gehoert er danach von Hand gestartet, sonst bleibt im Latest-Release
# das alte Bundle stehen oder es fehlt ganz.
#
# SICHERHEIT: Ein oeffentliches Repo kann jeder per Pull Request anstossen. GitHub gibt
# Fork-Pull-Requests keine Secrets - das ist die schuetzende Regel, und sie faellt, sobald
# irgendwo `pull_request_target` steht. Das kommt hier deshalb nicht vor, und der Ausloeser
# bleibt auf Tag-Push und Handstart beschraenkt.
#
# Benoetigte Secrets im oeffentlichen Repo - ZWEI, nicht drei:
#   PACKAGING_DEPLOY_KEY  privater SSH-Schluessel, oeffentlicher Teil als Deploy-Key im
#                         privaten packaging-Repo. Schreibrechte nur, wenn Schritt
#                         "Merkposten zurueckschreiben" genutzt wird.
#   AUR_SSH_KEY           privater SSH-Schluessel fuer aur.archlinux.org.
#
# KEIN eigener Release-Token noetig. Der Lauf schreibt nur in DIESES Repo, und dafuer stellt
# GitHub jedem Job automatisch einen bereit (secrets.GITHUB_TOKEN). Er ist auf dieses Repo
# begrenzt, verfaellt am Ende des Jobs und muss von niemandem verwaltet oder erneuert werden -
# anders als ein persoenlicher Token, der nach spaetestens einem Jahr ablaeuft und die Pipeline
# dann ohne erkennbaren Grund stehen laesst.
#
# Dafuer muss die Berechtigung ausdruecklich erteilt werden, siehe "permissions" unten:
# Voreingestellt ist der Token nur lesend.
#
# Die Fassungen der Actions gehoeren aktuell gehalten: laeuft eine auf einer abgekuendigten
# Node-Fassung, warnt GitHub erst und zwingt sie spaeter auf eine neue - was dann bricht, faellt
# mitten in einem Release auf.

name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur bauen, nichts veroeffentlichen"
        type: boolean
        default: true
      pakete:
        description: "Welche Pakete? 'alle' oder genau eines - der Rest wird dann nicht gebaut"
        type: choice
        default: alle
        options:
          - alle
          - aur
          - zip
          - appimage
          - deb
          - rpm
          - winzip
          - winsetup
          - maczip
          - armzip
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+*']

# Releases anlegen und Assets hochladen faellt unter "contents". Ohne diese Zeile darf der
# eingebaute Token nur lesen, und der erste Upload scheitert mit 403.
permissions:
  contents: write

# DER TROCKENLAUF IST DIE VOREINSTELLUNG, und zwar aus einem handfesten Grund: ein echter Lauf
# ersetzt das AUR-ZIP im Versionsrelease. Der PKGBUILD in der AUR nagelt eine Pruefsumme auf
# genau diese Adresse, und ein neu gebautes ZIP hat andere Bytes - zwischen dem Ersetzen und dem
# Nachziehen durch publish-aur.sh waere das AUR-Paket kaputt. Dazu laufen die festen
# Downloadadressen des Latest-Release beim Ersetzen kurz ins Leere.
#
# Gebaut wird im Trockenlauf trotzdem vollstaendig - das ist der Teil, der schiefgehen kann.
# Ein Tag-Push veroeffentlicht dagegen immer echt: dort gibt es keine Eingabe, und der Ausdruck
# faellt auf den leeren Wert zurueck.
#
# EINZELNE PAKETE: der Handstart bietet neben "alle" jedes Paket fuer sich an. Gebaut wird dann
# nur dieses eine, und hochgeladen wird es mit --partial - das Skript ersetzt damit allein die
# Datei, die es mitbringt, und weigert sich, das Latest-Release neu anzulegen. Ohne diese Marke
# stuende nach einem Einzellauf bei einer neuen Version nur noch dieses eine Paket darin.
#
# Ein Tag-Push hat keine Eingaben; der Ausdruck faellt dort auf "alle" zurueck.
env:
  DRY: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
  PAKETE: ${{ (github.event_name == 'workflow_dispatch' && inputs.pakete) || 'alle' }}

jobs:

  # ---------------------------------------------------------------------------------------
  # DIE AUR ZUERST. Sie haengt allein am AUR-ZIP, und das ist in Minuten gebaut. Alles andere
  # braucht sie nicht und sie nichts davon. Frueher lief der ganze Bau und der ganze Upload
  # zuerst, und die AUR stand solange auf der alten Version, obwohl das noetige Paket laengst
  # fertig war.
  # ---------------------------------------------------------------------------------------
  aur:
    name: AUR zuerst
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    # In einem job-level "if" gibt es den env-Kontext nicht, deshalb steht der Ausdruck hier
    # ausgeschrieben und nicht als $PAKETE.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.pakete == 'alle' || inputs.pakete == 'aur' }}

    steps:
      - name: Werkzeuge
        run: pacman -Sy --noconfirm --needed git openssh xz zip unzip jq curl python dotnet-sdk

      # Das oeffentliche Repo in die Wurzel, das private nach packaging/. Genau diese Anordnung
      # erwarten die Skripte: sie rechnen mit SCRIPT_DIR/.. als Repo-Wurzel. Deshalb ist an
      # ihnen nichts zu aendern.
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: Bitpainter75/FerrumPix-Build
          path: packaging
          ssh-key: ${{ secrets.PACKAGING_DEPLOY_KEY }}

      # libmpv-2.dll liegt im Repo nur komprimiert (112 MB roh, ueber GitHubs Grenze).
      # Auspacken und gegen die Sollwerte pruefen, BEVOR package.sh laeuft - das Handskript
      # bleibt dadurch unveraendert und findet die DLL einfach vor.
      - name: Fremdbinaerdateien bereitlegen
        run: packaging/ci/ensure-binaries.sh

      - name: AUR-ZIP bauen
        run: packaging/package.sh zip
        env:
          FERRUMPIX_BUILD_BOX: ""     # kein Distrobox-Wechsel, wir SIND schon im Container

      # Der Text des Versionsreleases kommt aus CHANGELOG.md, und die liegt im OEFFENTLICHEN Repo,
      # kommt also mit dessen Auscheck. Kein Nebenschauplatz: publish-aur.sh uebernimmt genau
      # diesen Text als AUR-Commit-Nachricht. Fehlt die Datei, faellt beides stillschweigend auf
      # einen nackten Titel zurueck.
      - name: AUR-ZIP ins Versionsrelease
        run: packaging/publish-github-release.sh --only-version $DRY
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Das AUR-Repo ist ein EIGENES Repo und nicht Teil des privaten packaging-Repos - dort
      # steht es in der .gitignore. Hier wird es frisch geklont.
      # BEFUND ERSTER LAUF: "Host key verification failed". Nicht der Schluessel war das Problem,
      # sondern dass der Runner aur.archlinux.org nicht kennt - ein frischer Runner hat eine leere
      # known_hosts, und ssh-keyscan hatte still nichts geliefert (kein -H mehr, damit sich das
      # Ergebnis auch nachlesen laesst).
      #
      # accept-new statt no: der Host wird beim ersten Kontakt uebernommen, ein WECHSEL des
      # Schluessels waehrend des Laufs faellt aber weiter auf. Strenger ginge nur mit einem fest
      # eingetragenen Fingerabdruck - der muesste dann bei jedem Schluesselwechsel der AUR von
      # Hand nachgezogen werden, und ein Release, das daran scheitert, faellt niemandem rechtzeitig auf.
      - name: AUR-Repo klonen
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_KEY }}" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null || true
          if grep -q aur.archlinux.org ~/.ssh/known_hosts 2>/dev/null; then
            echo "Hostschluessel der AUR uebernommen"
          else
            echo "ssh-keyscan lieferte nichts - es gilt accept-new"
          fi
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o StrictHostKeyChecking=accept-new"
          git clone ssh://aur@aur.archlinux.org/ferrumpix-bin.git packaging/AUR

      # makepkg laeuft nicht als root. Deshalb ein eigener Benutzer, der auch pushen darf.
      #
      # BEFUND: "Author identity unknown ... fatal: unable to auto-detect email address (got
      # 'builder@<container>.(none)')", Abbruch mit 128 beim Commit ins AUR-Repo. Der Benutzer wird
      # hier frisch angelegt und hat keine Git-Identitaet; die geraten Werte aus Benutzername und
      # Rechnername weist Git zurueck. Die Identitaet gehoert dem BENUTZER, nicht dem Auscheck -
      # deshalb --global fuer builder und nicht im Skript, das lokal Patricks eigene Einstellung
      # ueberschreiben wuerde.
      #
      # Es ist dieselbe Kennung, mit der auch von Hand veroeffentlicht wird. Eine eigene CI-Kennung
      # daneben liesse das Paket aussehen, als haette es den Betreuer gewechselt.
      - name: AUR veroeffentlichen
        run: |
          useradd -m builder
          chown -R builder:builder .
          cp -r ~/.ssh /home/builder/.ssh
          chown -R builder:builder /home/builder/.ssh
          su builder -c "git config --global user.name 'Bitpainter75'"
          su builder -c "git config --global user.email 'patrick@bitpainter.de'"
          su builder -c "GIT_SSH_COMMAND='ssh -i ~/.ssh/aur -o StrictHostKeyChecking=accept-new' packaging/publish-aur.sh $DRY"

  # ---------------------------------------------------------------------------------------
  # Ab hier ist die AUR aktuell. Was jetzt noch dauert, laesst niemanden mehr auf einer alten
  # Version sitzen.
  # ---------------------------------------------------------------------------------------
  rest:
    name: Alles Uebrige
    runs-on: ubuntu-latest
    needs: aur
    # always() ist noetig, weil der AUR-Job bei einer Einzelauswahl uebersprungen wird und ein
    # uebersprungenes needs sonst auch diesen Job ueberspringt. Ein FEHLGESCHLAGENER AUR-Job
    # haelt den Lauf dagegen weiterhin an - das ist der Sinn der Reihenfolge.
    # Wurde nur die AUR gewaehlt, gibt es hier nichts zu tun.
    if: ${{ always()
            && needs.aur.result != 'failure' && needs.aur.result != 'cancelled'
            && (github.event_name != 'workflow_dispatch' || inputs.pakete != 'aur') }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: Bitpainter75/FerrumPix-Build
          path: packaging
          ssh-key: ${{ secrets.PACKAGING_DEPLOY_KEY }}

      # NICHT auf das vorinstallierte .NET des Runners verlassen: das Projekt steht auf net10.0,
      # und welche SDKs ein Runner-Abbild mitbringt, aendert sich ohne Vorwarnung. Ein fehlendes
      # SDK faellt sonst erst im dritten Bauschritt auf, nach zwanzig Minuten Laufzeit.
      # Im Arch-Container oben braucht es das nicht - dort kommt dotnet-sdk aus pacman.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Dieser Schritt blieb wiederholt stehen, mal in "apt-get update", mal mitten im
      # Herunterladen der Pakete - beides an denselben Zeilen: die Laeufer stehen in Azure und
      # bekommen dessen Ubuntu-Spiegel zuerst vorgesetzt (/etc/apt/apt-mirrors.txt, von
      # ubuntu.sources als "mirror+file:" gelesen). Klemmt der Spiegel, wartet apt ohne Ende; im
      # Log sind es die Runden "Ign: azure.archive.ubuntu.com" oder ein "Get:" ohne Fortsetzung.
      # Die Zeitschranke macht daraus im Wiederholungsfall einen schnellen Fehlschlag statt einer
      # Haengepartie mitten im Release.
      - name: Werkzeuge
        timeout-minutes: 10
        run: |
          # Herausgeloescht, nicht neu geschrieben: die Datei hat ein eigenes Format (ein Spiegel je
          # Zeile, dahinter Angaben wie "priority:2"), und das bleibt so unangetastet. Gezaehlt wird
          # vorher, damit nicht der letzte Spiegel verschwindet - dann stuende apt ganz ohne da.
          mirrors=/etc/apt/apt-mirrors.txt
          if [ -f "$mirrors" ]; then
            alle=$(grep -cE '^[[:space:]]*https?://' "$mirrors" || true)
            azure=$(grep -cE '^[[:space:]]*https?://[^[:space:]]*azure\.archive\.ubuntu\.com' "$mirrors" || true)
            if [ "$azure" -gt 0 ] && [ "$alle" -gt "$azure" ]; then
              sudo sed -i '/azure\.archive\.ubuntu\.com/d' "$mirrors"
              echo "Spiegelliste ohne Azure:"; cat "$mirrors"
            else
              echo "HINWEIS: Spiegelliste unveraendert ($alle Spiegel, davon $azure bei Azure)."
            fi
          fi
          # Timeout wirkt auch auf eine STEHENDE Uebertragung, nicht nur auf den Verbindungsaufbau.
          # ForceIPv4 ist das zweite gaengige Mittel: die Laeufer bekommen AAAA-Eintraege, ueber die
          # dann keine Daten fliessen, und apt merkt das von sich aus nicht.
          printf 'Acquire::Retries "2";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::ForceIPv4 "true";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-release-timeouts >/dev/null
          sudo apt-get update
          sudo apt-get install -y nsis xz-utils jq rpm zsync desktop-file-utils

      # FLATPAK IST HIER RAUS und hat einen eigenen Lauf: flatpak-only.yml. Er war mit gut vier
      # Minuten der teuerste Schritt, brauchte flatpak-builder samt Laufzeitumgebung von Flathub,
      # und sein Bauordner mit Symlinks hat dem Windows-Bau schon einmal die Aufloesung von
      # `**/*.axaml` zerschossen. Fuer ein Paket, das keinen der anderen Schritte braucht.
      #
      # WAS MAN DAFUER IM AUGE BEHALTEN MUSS: der Upload ersetzt nur, was im Bauordner liegt.
      # Ohne den Flatpak-Lauf bleibt die ALTE FerrumPix.flatpak im Latest-Release stehen und geht
      # stillschweigend als aktuell durch - ein fehlendes Paket faellt auf, ein veraltetes nicht.
      # Bei einer neuen Version mit pkgrel 1 ist es umgekehrt: das Latest-Release wird geloescht
      # und neu angelegt, dann fehlt der Flatpak ganz. In beiden Faellen gehoert flatpak-only.yml
      # NACH diesem Lauf gestartet, mit veroeffentlichen=true.

      - name: Fremdbinaerdateien bereitlegen
        run: packaging/ci/ensure-binaries.sh

      # EIN SCHRITT JE PAKET statt einem einzigen "all". Faellt eines aus, steht es in der
      # Uebersicht des Laufs mit Namen da, statt dass man ein Protokoll ueber tausende Zeilen
      # durchsucht - und man sieht auf einen Blick, welches Paket wie lange braucht.
      #
      # DER PREIS, und er ist bezahlbar: package.sh ruft `publish` einmal VOR der Modus-Auswahl
      # auf, und AppImage, ZIP, deb und rpm teilen sich dieses eine Ergebnis. Getrennte Aufrufe
      # bauen es je neu - gemessen rund 27 Sekunden je Durchgang, macht ein paar Minuten ueber
      # den ganzen Lauf. Windows, macOS und ARM bauen ohnehin schon jeweils eigene.
      #
      # DIE REIHENFOLGE IST NACH WICHTIGKEIT, nicht nach Bequemlichkeit: Linux-ZIP, AUR und
      # AppImage zuerst, dann deb und rpm, dann Windows, dann macOS, und ganz zuletzt ARM.
      # Bricht es spaet ab, weiss man dadurch trotzdem, dass die wichtigen Pakete bauen.
      #
      # Nicht trennbar sind macOS (x64 und arm64 in einem Modus) und ARM (linux-arm64 und
      # win-arm64 in einem) - das ginge nur, indem man package.sh aendert.
      #
      # Bricht ein Schritt ab, endet der Job VOR dem Hochladen - ein halber Satz Pakete darf nie
      # ins Release, sonst steht Neues neben Altem und niemand sieht es.
      - name: Paket - Linux-ZIP (mit AUR-ZIP)
        if: ${{ env.PAKETE == 'alle' || env.PAKETE == 'zip' }}
        run: packaging/package.sh zip
        env:
          FERRUMPIX_BUILD_BOX: ""     # der Runner ist bereits Ubuntu

      - name: Paket - AppImage
        if: ${{ env.PAKETE == 'alle' || env.PAKETE == 'appimage' }}
        run: packaging/package.sh appimage
        env:
          FERRUMPIX_BUILD_BOX: ""

      - name: Paket - deb
        if: ${{ env.PAKETE == 'alle' || env.PAKETE == 'deb' }}
        run: packaging/package.sh deb
        env:
          FERRUMPIX_BUILD_BOX: ""

      - name: Paket - rpm
        if: ${{ env.PAKETE == 'alle' || env.PAKETE == 'rpm' }}
        run: packaging/package.sh rpm
        env:
          FERRUMPIX_BUILD_BOX: ""

      - name: Paket - Windows-ZIP
        if: ${{ env.PAKETE == 'alle' || env.PAKETE == 'winzip' }}
        run: packaging/package.sh winzip
        env:
          FERRUMPIX_BUILD_BOX: ""

      - name: Paket - Windows-Setup
        if: ${{ env.PAKETE == 'alle' || env.PAKETE == 'winsetup' }}
        run: packaging/package.sh winsetup
        env:
          FERRUMPIX_BUILD_BOX: ""

      - name: Paket - macOS-ZIPs (x64 + arm64)
        if: ${{ env.PAKETE == 'alle' || env.PAKETE == 'maczip' }}
        run: packaging/package.sh maczip
        env:
          FERRUMPIX_BUILD_BOX: ""

      - name: Paket - ARM64-ZIPs (linux + win)
        if: ${{ env.PAKETE == 'alle' || env.PAKETE == 'armzip' }}
        run: packaging/package.sh armzip
        env:
          FERRUMPIX_BUILD_BOX: ""

      # --partial bei jeder Einzelauswahl. Das Skript ersetzt dann allein die Datei, die dieser
      # Lauf gebaut hat, und legt das Latest-Release unter keinen Umstaenden neu an - sonst
      # stuende danach nur dieses eine Paket darin. Es bricht ab, wenn ein Neuanlegen faellig
      # waere, und sagt, dass zuerst ein vollstaendiger Lauf gehoert.
      - name: Ins Latest-Release
        run: |
          if [ "$PAKETE" = "alle" ]; then
            packaging/publish-github-release.sh --only-latest $DRY
          else
            packaging/publish-github-release.sh --only-latest --partial $DRY
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # PUBLISHED-VERSION und DOWNLOADS.md sind ZUSTAND: die Skripte lesen und schreiben sie.
      # Ohne Zurueckschreiben faengt jeder Lauf beim Stand aus dem Repo an. Bei DOWNLOADS.md
      # ginge die Historie verloren; bei PUBLISHED-VERSION ist es heikler - leer heisst fuer das
      # Skript "unbekannt", und bei pkgrel 1 loescht es dann das Latest-Release und legt es neu
      # an. Bei einer echten neuen Version ist das richtig, bei einem WIEDERHOLTEN Lauf reisst
      # es die festen Downloadadressen ohne Not ab.
      #
      # Setzt einen Deploy-Key mit SCHREIBrechten voraus.
      # Vor dem Push wird NEU AUFGESETZT. Der Runner hat seinen Stand beim Auschecken geholt,
      # und bis hierher vergehen gut vierzehn Minuten - wer in dieser Zeit ins Build-Repo
      # schiebt, laesst den Push scheitern. Genau das ist am 2026-08-15 passiert: der ganze Lauf
      # war durch, die Pakete lagen draussen, und nur die beiden Merkposten blieben liegen.
      # Der Versuch wird zweimal wiederholt, damit auch ein Schieben WAEHREND des Rebase nicht
      # gleich das Ergebnis kostet.
      - name: Merkposten zurueckschreiben
        run: |
          cd packaging
          git config user.name  "FerrumPix CI"
          git config user.email "ci@bitpainter.de"
          git add PUBLISHED-VERSION DOWNLOADS.md
          git diff --cached --quiet || git commit -m "Stand nach $(cat ../VERSION)"
          for versuch in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "Push abgelehnt, Versuch $versuch von 3 - es wird neu aufgesetzt"
            sleep 5
          done
          echo "::error::Merkposten liessen sich nicht zurueckschreiben"
          exit 1
