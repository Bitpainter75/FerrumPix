# Vorlage. Gehoert ins OEFFENTLICHE Repo nach .github/workflows/release.yml
#
# Warum dort und nicht ins private packaging-Repo: Actions-Minuten sind fuer oeffentliche Repos
# frei, fuer private werden sie gegen das Monatskontingent gerechnet. Ein voller Lauf ueber alle
# Plattformen ist nicht kurz.
#
# AUR und Flatpak haben eigene Veroeffentlichungslaeufe. "alle" baut hier deshalb nur die
# uebrigen Release-Pakete.
#
# SICHERHEIT: Ein oeffentliches Repo kann jeder per Pull Request anstossen. GitHub gibt
# Fork-Pull-Requests keine Secrets - das ist die schuetzende Regel, und sie faellt, sobald
# irgendwo `pull_request_target` steht. Das kommt hier deshalb nicht vor, und der Ausloeser
# bleibt auf Tag-Push und Handstart beschraenkt.
#
# Benoetigte Secrets im oeffentlichen Repo - ZWEI, nicht drei:
#   PACKAGING_DEPLOY_KEY  privater SSH-Schluessel, oeffentlicher Teil als Deploy-Key im
#                         privaten packaging-Repo. Lesen genuegt: der Lauf schreibt nichts
#                         mehr dorthin zurueck.
#
# KEIN eigener Release-Token noetig. Der Lauf schreibt nur in DIESES Repo, und dafuer stellt
# GitHub jedem Job automatisch einen bereit (secrets.GITHUB_TOKEN). Er ist auf dieses Repo
# begrenzt, verfaellt am Ende des Jobs und muss von niemandem verwaltet oder erneuert werden -
# anders als ein persoenlicher Token, der nach spaetestens einem Jahr ablaeuft und die Pipeline
# dann ohne erkennbaren Grund stehen laesst.
#
# Dafuer muss die Berechtigung ausdruecklich erteilt werden, siehe "permissions" unten:
# Voreingestellt ist der Token nur lesend.
#
# Die Fassungen der Actions gehoeren aktuell gehalten: laeuft eine auf einer abgekuendigten
# Node-Fassung, warnt GitHub erst und zwingt sie spaeter auf eine neue - was dann bricht, faellt
# mitten in einem Release auf.

name: Release

on:
  workflow_dispatch:
    inputs:
      pakete:
        description: "Welche Pakete? 'alle' baut alles ausser AUR und Flatpak; sonst genau eines"
        type: choice
        default: alle
        options:
          - alle
          - zip
          - appimage
          - deb
          - rpm
          - winzip
          - winsetup
          - maczip
          - armzip
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+*']

# Releases anlegen und Assets hochladen faellt unter "contents". Ohne diese Zeile darf der
# eingebaute Token nur lesen, und der erste Upload scheitert mit 403.
permissions:
  contents: write

# EINZELNE PAKETE: der Handstart bietet neben "alle" jedes Paket fuer sich an. Gebaut und
# hochgeladen wird dann nur dieses eine; die uebrigen Dateien des Latest-Release bleiben, wo sie
# sind.
#
# Ein Tag-Push hat keine Eingaben; der Ausdruck faellt dort auf "alle" zurueck.
env:
  PAKETE: ${{ (github.event_name == 'workflow_dispatch' && inputs.pakete) || 'alle' }}

jobs:

  rest:
    name: Alle Packages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: Bitpainter75/FerrumPix-Build
          path: packaging
          ssh-key: ${{ secrets.PACKAGING_DEPLOY_KEY }}

      # NICHT auf das vorinstallierte .NET des Runners verlassen: das Projekt steht auf net10.0,
      # und welche SDKs ein Runner-Abbild mitbringt, aendert sich ohne Vorwarnung. Ein fehlendes
      # SDK faellt sonst erst im dritten Bauschritt auf, nach zwanzig Minuten Laufzeit.
      # Im Arch-Container oben braucht es das nicht - dort kommt dotnet-sdk aus pacman.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Dieser Schritt blieb wiederholt stehen, mal in "apt-get update", mal mitten im
      # Herunterladen der Pakete - beides an denselben Zeilen: die Laeufer stehen in Azure und
      # bekommen dessen Ubuntu-Spiegel zuerst vorgesetzt (/etc/apt/apt-mirrors.txt, von
      # ubuntu.sources als "mirror+file:" gelesen). Klemmt der Spiegel, wartet apt ohne Ende; im
      # Log sind es die Runden "Ign: azure.archive.ubuntu.com" oder ein "Get:" ohne Fortsetzung.
      # Die Zeitschranke macht daraus im Wiederholungsfall einen schnellen Fehlschlag statt einer
      # Haengepartie mitten im Release.
      - name: Werkzeuge
        timeout-minutes: 10
        run: |
          # Herausgeloescht, nicht neu geschrieben: die Datei hat ein eigenes Format (ein Spiegel je
          # Zeile, dahinter Angaben wie "priority:2"), und das bleibt so unangetastet. Gezaehlt wird
          # vorher, damit nicht der letzte Spiegel verschwindet - dann stuende apt ganz ohne da.
          mirrors=/etc/apt/apt-mirrors.txt
          if [ -f "$mirrors" ]; then
            alle=$(grep -cE '^[[:space:]]*https?://' "$mirrors" || true)
            azure=$(grep -cE '^[[:space:]]*https?://[^[:space:]]*azure\.archive\.ubuntu\.com' "$mirrors" || true)
            if [ "$azure" -gt 0 ] && [ "$alle" -gt "$azure" ]; then
              sudo sed -i '/azure\.archive\.ubuntu\.com/d' "$mirrors"
              echo "Spiegelliste ohne Azure:"; cat "$mirrors"
            else
              echo "HINWEIS: Spiegelliste unveraendert ($alle Spiegel, davon $azure bei Azure)."
            fi
          fi
          # Timeout wirkt auch auf eine STEHENDE Uebertragung, nicht nur auf den Verbindungsaufbau.
          # ForceIPv4 ist das zweite gaengige Mittel: die Laeufer bekommen AAAA-Eintraege, ueber die
          # dann keine Daten fliessen, und apt merkt das von sich aus nicht.
          printf 'Acquire::Retries "2";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::ForceIPv4 "true";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-release-timeouts >/dev/null
          sudo apt-get update
          sudo apt-get install -y nsis xz-utils jq rpm zsync desktop-file-utils

      # FLATPAK IST HIER RAUS und hat einen eigenen Lauf: flatpak-only.yml. Er war mit gut vier
      # Minuten der teuerste Schritt, brauchte flatpak-builder samt Laufzeitumgebung von Flathub,
      # und sein Bauordner mit Symlinks hat dem Windows-Bau schon einmal die Aufloesung von
      # `**/*.axaml` zerschossen. Fuer ein Paket, das keinen der anderen Schritte braucht.
      #
      # WAS MAN DAFUER IM AUGE BEHALTEN MUSS: der Upload ersetzt nur, was im Bauordner liegt.
      # Ohne den Flatpak-Lauf bleibt die ALTE FerrumPix.flatpak im Latest-Release stehen und geht
      # stillschweigend als aktuell durch - ein fehlendes Paket faellt auf, ein veraltetes nicht.
      # Bei einer neuen Version mit pkgrel 1 ist es umgekehrt: das Latest-Release wird geloescht
      # und neu angelegt, dann fehlt der Flatpak ganz. In beiden Faellen gehoert flatpak-only.yml
      # NACH diesem Lauf gestartet, mit veroeffentlichen=true.

      - name: Fremdbinaerdateien bereitlegen
        run: packaging/ci/ensure-binaries.sh

      # EIN SCHRITT JE PAKET statt einem einzigen "all". Faellt eines aus, steht es in der
      # Uebersicht des Laufs mit Namen da, statt dass man ein Protokoll ueber tausende Zeilen
      # durchsucht - und man sieht auf einen Blick, welches Paket wie lange braucht.
      #
      # DER PREIS, und er ist bezahlbar: package.sh ruft `publish` einmal VOR der Modus-Auswahl
      # auf, und AppImage, ZIP, deb und rpm teilen sich dieses eine Ergebnis. Getrennte Aufrufe
      # bauen es je neu - gemessen rund 27 Sekunden je Durchgang, macht ein paar Minuten ueber
      # den ganzen Lauf. Windows, macOS und ARM bauen ohnehin schon jeweils eigene.
      #
      # DIE REIHENFOLGE IST NACH WICHTIGKEIT, nicht nach Bequemlichkeit: Linux-ZIP und
      # AppImage zuerst, dann deb und rpm, dann Windows, dann macOS, und ganz zuletzt ARM.
      # Bricht es spaet ab, weiss man dadurch trotzdem, dass die wichtigen Pakete bauen.
      #
      # Nicht trennbar sind macOS (x64 und arm64 in einem Modus) und ARM (linux-arm64 und
      # win-arm64 in einem) - das ginge nur, indem man package.sh aendert.
      #
      # Bricht ein Schritt ab, endet der Job VOR dem Hochladen - ein halber Satz Pakete darf nie
      # ins Release, sonst steht Neues neben Altem und niemand sieht es.
      - name: Paket - Linux-ZIP
        if: ${{ env.PAKETE == 'alle' || env.PAKETE == 'zip' }}
        run: packaging/package.sh zip
        env:
          FERRUMPIX_BUILD_BOX: ""     # der Runner ist bereits Ubuntu

      - name: Paket - AppImage
        if: ${{ env.PAKETE == 'alle' || env.PAKETE == 'appimage' }}
        run: packaging/package.sh appimage
        env:
          FERRUMPIX_BUILD_BOX: ""

      - name: Paket - deb
        if: ${{ env.PAKETE == 'alle' || env.PAKETE == 'deb' }}
        run: packaging/package.sh deb
        env:
          FERRUMPIX_BUILD_BOX: ""

      - name: Paket - rpm
        if: ${{ env.PAKETE == 'alle' || env.PAKETE == 'rpm' }}
        run: packaging/package.sh rpm
        env:
          FERRUMPIX_BUILD_BOX: ""

      - name: Paket - Windows-ZIP
        if: ${{ env.PAKETE == 'alle' || env.PAKETE == 'winzip' }}
        run: packaging/package.sh winzip
        env:
          FERRUMPIX_BUILD_BOX: ""

      - name: Paket - Windows-Setup
        if: ${{ env.PAKETE == 'alle' || env.PAKETE == 'winsetup' }}
        run: packaging/package.sh winsetup
        env:
          FERRUMPIX_BUILD_BOX: ""

      - name: Paket - macOS-ZIPs (x64 + arm64)
        if: ${{ env.PAKETE == 'alle' || env.PAKETE == 'maczip' }}
        run: packaging/package.sh maczip
        env:
          FERRUMPIX_BUILD_BOX: ""

      - name: Paket - ARM64-ZIPs (linux + win)
        if: ${{ env.PAKETE == 'alle' || env.PAKETE == 'armzip' }}
        run: packaging/package.sh armzip
        env:
          FERRUMPIX_BUILD_BOX: ""

      # Ein Einzellauf bringt genau ein Paket mit, und mehr ersetzt das Skript auch nicht: es legt
      # jede Datei, die es ueberschreibt, zuerst unter ".vorherige" zur Seite und wirft sie erst
      # weg, wenn die neue oben ist. Das Latest-Release selbst wird nie geloescht.
      - name: Ins Latest-Release
        run: packaging/publish-github-release.sh --only-latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
