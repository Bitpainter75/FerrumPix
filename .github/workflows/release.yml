# Vorlage. Gehoert ins OEFFENTLICHE Repo nach .github/workflows/release.yml
#
# Warum dort und nicht ins private packaging-Repo: Actions-Minuten sind fuer oeffentliche Repos
# frei, fuer private werden sie gegen das Monatskontingent gerechnet. Ein voller Lauf ueber alle
# Plattformen ist nicht kurz.
#
# EIN LAUF FUER ALLES AUSSER DER AUR. Flatpak und MSIX hatten eigene Laeufe; seit es nur noch ein
# Release gibt (siehe publish-github-release.sh), gehoeren sie hierher: eine neue Version wird
# dort als Entwurf mit ALLEN Dateien aufgebaut und auf einmal veroeffentlicht, und dafuer muessen
# alle Pakete im selben Lauf fertig werden.
#
# DIE AUR KOMMT VORHER, mit aur-only.yml: ihr ZIP geht in das noch aktuelle Release, laesst sich
# pruefen, und dieser Lauf nimmt es beim Wechsel auf die neue Version byte-gleich mit.
#
# DER AUFBAU: je ein Job baut (Pakete, Flatpak, MSIX), legt seine Dateien als Artefakt ab, und
# ein letzter Job sammelt sie ein und veroeffentlicht in einem Zug. Faellt ein Bau-Job aus, laeuft
# der letzte nicht - ein halber Satz Pakete darf nie ins Release.
#
# DIE MSIX GEHT NICHT INS RELEASE. Ein Store-Paket wird unsigniert eingereicht, der Store signiert
# selbst - und unsigniert laesst Windows es nicht installieren. Es steht als Artefakt am Lauf, von
# wo aus es ins Partner Center hochgeladen wird. Gebaut wird sie nur mit einer Paketversion.
#
# SICHERHEIT: Ein oeffentliches Repo kann jeder per Pull Request anstossen. GitHub gibt
# Fork-Pull-Requests keine Secrets - das ist die schuetzende Regel, und sie faellt, sobald
# irgendwo `pull_request_target` steht. Das kommt hier deshalb nicht vor.
#
# KEIN AUSLOESER PER TAG MEHR, nur der Handstart. Das Veroeffentlichen legt beim Archivieren einer
# Version selbst einen Tag an (etwa 0.9.50-3); ein Tag-Ausloeser startete daraufhin einen Lauf fuer
# die ALTE Version, sobald das Skript von Hand mit einem persoenlichen Token laeuft.
#
# Benoetigte Secrets im oeffentlichen Repo:
#   PACKAGING_DEPLOY_KEY  privater SSH-Schluessel, oeffentlicher Teil als Deploy-Key im
#                         privaten packaging-Repo. Lesen genuegt.
#   RELEASE_TOKEN         Fine-grained Token NUR fuer dieses Repo, Rechte "Contents" und
#                         "Workflows" auf Lesen und Schreiben. Ohne ihn nimmt der Lauf den
#                         eingebauten GITHUB_TOKEN, und der darf keinen Tag auf einen Commit
#                         setzen, dessen Workflow-Dateien vom Stand auf main abweichen. Genau das
#                         tun Archivieren und Umhaengen von "latest", sobald sich zwischen zwei
#                         Versionen ein Workflow geaendert hat (0.9.50: 403 beim Archivieren).
#
# Fuer die MSIX als Repository-Variablen (keine Secrets, die Werte stehen in jedem Paket), alle
# aus dem Partner Center, aus der Identitaet der Anwendung:
#   MSIX_IDENTITY_NAME           z.B. 12345Bitpainter75.FerrumPix
#   MSIX_PUBLISHER               z.B. CN=ABCDEF12-3456-7890-ABCD-EF1234567890
#   MSIX_PUBLISHER_DISPLAY_NAME  der Name, den der Store anzeigt
#
# Die Fassungen der Actions gehoeren aktuell gehalten: laeuft eine auf einer abgekuendigten
# Node-Fassung, warnt GitHub erst und zwingt sie spaeter auf eine neue.

name: Release

on:
  workflow_dispatch:
    inputs:
      pakete:
        description: "Welche Pakete? 'alle' baut alles ausser der AUR; sonst genau eines"
        type: choice
        default: alle
        options:
          - alle
          - zip
          - appimage
          - deb
          - rpm
          - winzip
          - winsetup
          - maczip
          - armzip
          - flatpak
          - msix
      paketversion:
        description: "MSIX-Paketversion, vier Zahlen, die letzte 0 (z.B. 1.0.0.0). Pflicht bei msix; bei alle bedeutet leer: keine MSIX"
        type: string
        required: false
        default: ""

# Releases anlegen und Assets hochladen faellt unter "contents". Ohne diese Zeile darf der
# eingebaute Token nur lesen, und der erste Upload scheitert mit 403.
permissions:
  contents: write

env:
  PAKETE: ${{ inputs.pakete || 'alle' }}

jobs:

  pakete:
    name: Pakete
    runs-on: ubuntu-latest
    if: ${{ inputs.pakete != 'flatpak' && inputs.pakete != 'msix' }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: Bitpainter75/FerrumPix-Build
          path: packaging
          ssh-key: ${{ secrets.PACKAGING_DEPLOY_KEY }}

      # NICHT auf das vorinstallierte .NET des Runners verlassen: das Projekt steht auf net10.0,
      # und welche SDKs ein Runner-Abbild mitbringt, aendert sich ohne Vorwarnung.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Dieser Schritt blieb wiederholt stehen, mal in "apt-get update", mal mitten im
      # Herunterladen der Pakete - beides an denselben Zeilen: die Laeufer stehen in Azure und
      # bekommen dessen Ubuntu-Spiegel zuerst vorgesetzt (/etc/apt/apt-mirrors.txt, von
      # ubuntu.sources als "mirror+file:" gelesen). Klemmt der Spiegel, wartet apt ohne Ende; im
      # Log sind es die Runden "Ign: azure.archive.ubuntu.com" oder ein "Get:" ohne Fortsetzung.
      # Die Zeitschranke macht daraus im Wiederholungsfall einen schnellen Fehlschlag statt einer
      # Haengepartie mitten im Release.
      - name: Werkzeuge
        timeout-minutes: 10
        run: |
          # Herausgeloescht, nicht neu geschrieben: die Datei hat ein eigenes Format (ein Spiegel je
          # Zeile, dahinter Angaben wie "priority:2"), und das bleibt so unangetastet. Gezaehlt wird
          # vorher, damit nicht der letzte Spiegel verschwindet - dann stuende apt ganz ohne da.
          mirrors=/etc/apt/apt-mirrors.txt
          if [ -f "$mirrors" ]; then
            alle=$(grep -cE '^[[:space:]]*https?://' "$mirrors" || true)
            azure=$(grep -cE '^[[:space:]]*https?://[^[:space:]]*azure\.archive\.ubuntu\.com' "$mirrors" || true)
            if [ "$azure" -gt 0 ] && [ "$alle" -gt "$azure" ]; then
              sudo sed -i '/azure\.archive\.ubuntu\.com/d' "$mirrors"
              echo "Spiegelliste ohne Azure:"; cat "$mirrors"
            else
              echo "HINWEIS: Spiegelliste unveraendert ($alle Spiegel, davon $azure bei Azure)."
            fi
          fi
          # Timeout wirkt auch auf eine STEHENDE Uebertragung, nicht nur auf den Verbindungsaufbau.
          # ForceIPv4 ist das zweite gaengige Mittel: die Laeufer bekommen AAAA-Eintraege, ueber die
          # dann keine Daten fliessen, und apt merkt das von sich aus nicht.
          printf 'Acquire::Retries "2";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::ForceIPv4 "true";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-release-timeouts >/dev/null
          sudo apt-get update
          sudo apt-get install -y nsis xz-utils jq rpm zsync desktop-file-utils zip

      - name: Fremdbinaerdateien bereitlegen
        run: packaging/ci/ensure-binaries.sh

      # EIN SCHRITT JE PAKET statt einem einzigen "all". Faellt eines aus, steht es in der
      # Uebersicht des Laufs mit Namen da, und man sieht, welches Paket wie lange braucht.
      #
      # DER PREIS: package.sh ruft `publish` einmal VOR der Modus-Auswahl auf, und AppImage, ZIP,
      # deb und rpm teilen sich dieses eine Ergebnis. Getrennte Aufrufe bauen es je neu - gemessen
      # rund 27 Sekunden je Durchgang.
      #
      # DIE REIHENFOLGE IST NACH WICHTIGKEIT: Linux-ZIP und AppImage zuerst, dann deb und rpm,
      # dann Windows, dann macOS, und ganz zuletzt ARM.
      #
      # DAS AUR-ZIP BAUT DIESER LAUF NICHT. Es entsteht vorher im AUR-Lauf und liegt schon im
      # Release; beim Wechsel auf eine neue Version nimmt das Skript es byte-gleich mit.
      - name: Paket - Linux-ZIP
        if: ${{ env.PAKETE == 'alle' || env.PAKETE == 'zip' }}
        run: packaging/package.sh zip
        env:
          FERRUMPIX_BUILD_BOX: ""     # der Runner ist bereits Ubuntu

      - name: Paket - AppImage
        if: ${{ env.PAKETE == 'alle' || env.PAKETE == 'appimage' }}
        run: packaging/package.sh appimage
        env:
          FERRUMPIX_BUILD_BOX: ""

      - name: Paket - deb
        if: ${{ env.PAKETE == 'alle' || env.PAKETE == 'deb' }}
        run: packaging/package.sh deb
        env:
          FERRUMPIX_BUILD_BOX: ""

      - name: Paket - rpm
        if: ${{ env.PAKETE == 'alle' || env.PAKETE == 'rpm' }}
        run: packaging/package.sh rpm
        env:
          FERRUMPIX_BUILD_BOX: ""

      - name: Paket - Windows-ZIP
        if: ${{ env.PAKETE == 'alle' || env.PAKETE == 'winzip' }}
        run: packaging/package.sh winzip
        env:
          FERRUMPIX_BUILD_BOX: ""

      - name: Paket - Windows-Setup
        if: ${{ env.PAKETE == 'alle' || env.PAKETE == 'winsetup' }}
        run: packaging/package.sh winsetup
        env:
          FERRUMPIX_BUILD_BOX: ""

      - name: Paket - macOS-ZIPs (x64 + arm64)
        if: ${{ env.PAKETE == 'alle' || env.PAKETE == 'maczip' }}
        run: packaging/package.sh maczip
        env:
          FERRUMPIX_BUILD_BOX: ""

      - name: Paket - ARM64-ZIPs (linux + win)
        if: ${{ env.PAKETE == 'alle' || env.PAKETE == 'armzip' }}
        run: packaging/package.sh armzip
        env:
          FERRUMPIX_BUILD_BOX: ""

      # Nur die Dateien dieses Builds: sie tragen alle die Buildnummer, dazu die zsync unter dem
      # alten Namen. Das Hochladen macht erst der letzte Job.
      - uses: actions/upload-artifact@v7
        with:
          name: pakete
          path: packaging/build/FerrumPix*
          if-no-files-found: error
          retention-days: 3

  flatpak:
    name: Flatpak
    runs-on: ubuntu-latest
    if: ${{ inputs.pakete == 'alle' || inputs.pakete == 'flatpak' }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: Bitpainter75/FerrumPix-Build
          path: packaging
          ssh-key: ${{ secrets.PACKAGING_DEPLOY_KEY }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Werkzeuge
        timeout-minutes: 10
        run: |
          printf 'Acquire::Retries "2";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::ForceIPv4 "true";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-release-timeouts >/dev/null
          sudo apt-get update
          sudo apt-get install -y xz-utils jq desktop-file-utils flatpak flatpak-builder

      # Version und Name muessen mit dem Manifest uebereinstimmen (runtime-version 24.08). Die
      # SDK-Erweiterung bringt das .NET-SDK mit, mit dem der Bau in der Sandbox uebersetzt.
      - name: Flatpak-Laufzeitumgebung
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --noninteractive flathub \
            org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08 \
            org.freedesktop.Sdk.Extension.dotnet10//24.08

      # Er laedt rund 843 MB NuGet-Pakete und uebersetzt danach in der Sandbox. Die Zeitschranke
      # ist grosszuegig und trotzdem ein Riegel gegen GitHubs Sechs-Stunden-Grenze.
      - name: Paket - Flatpak
        timeout-minutes: 60
        run: packaging/package.sh flatpak
        env:
          FERRUMPIX_BUILD_BOX: ""

      # Der Beweis, nicht die Absicht: das gebaute Bundle wird installiert und nach seinen
      # Rechten gefragt. Was im Manifest steht, ist eine Behauptung - was hier steht, gilt.
      - name: Berechtigungen des Bundles zeigen
        run: |
          bundle=$(ls packaging/build/*.flatpak | head -1)
          echo "Bundle: $bundle"
          sudo flatpak install -y --noninteractive "$bundle"
          flatpak info --show-permissions io.github.Bitpainter75.FerrumPix

      - uses: actions/upload-artifact@v7
        with:
          name: flatpak
          path: packaging/build/*.flatpak
          if-no-files-found: error
          retention-days: 3

  msix-nutzlast:
    name: MSIX - Nutzlast (Linux)
    runs-on: ubuntu-latest
    # Bei "msix" laeuft der Job IMMER, auch ohne Paketversion: sonst wurde er still
    # uebersprungen, der Windows-Job hinter ihm ebenso, und der Lauf endete gruen, ohne etwas
    # gebaut zu haben. Der erste Schritt meldet die fehlende Angabe als Fehler.
    if: ${{ inputs.pakete == 'msix' || (inputs.pakete == 'alle' && inputs.paketversion != '') }}

    steps:
      - name: Paketversion angegeben?
        env:
          PAKETVERSION: ${{ inputs.paketversion }}
        run: |
          if [ -z "$PAKETVERSION" ]; then
            echo "::error::Fuer msix ist die Paketversion Pflicht (vier Zahlen, die letzte 0, z.B. 1.0.0.0)."
            exit 1
          fi

      # ZUERST, noch vor dem Auschecken: fehlen die Angaben, steht das Scheitern schon fest.
      # Die Werte gehen ueber env hinein und nicht direkt in den Skripttext.
      - name: Angaben aus dem Partner Center vorhanden?
        env:
          IDENTITY: ${{ vars.MSIX_IDENTITY_NAME }}
          HERAUSGEBER: ${{ vars.MSIX_PUBLISHER }}
          ANZEIGENAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          fehlt=""
          [ -n "$IDENTITY" ]    || fehlt="$fehlt MSIX_IDENTITY_NAME"
          [ -n "$HERAUSGEBER" ] || fehlt="$fehlt MSIX_PUBLISHER"
          [ -n "$ANZEIGENAME" ] || fehlt="$fehlt MSIX_PUBLISHER_DISPLAY_NAME"
          if [ -n "$fehlt" ]; then
            echo "::error::Es fehlen die Repository-Variablen:$fehlt - einzutragen unter Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
          echo "Identitaet:  $IDENTITY"
          echo "Herausgeber: $HERAUSGEBER"

      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: Bitpainter75/FerrumPix-Build
          path: packaging
          ssh-key: ${{ secrets.PACKAGING_DEPLOY_KEY }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # ImageMagick verkleinert das Anwendungssymbol auf die vier Groessen, die der Store verlangt.
      - name: Werkzeuge
        timeout-minutes: 10
        run: |
          printf 'Acquire::Retries "2";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::ForceIPv4 "true";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-release-timeouts >/dev/null
          sudo apt-get update
          sudo apt-get install -y imagemagick xz-utils

      - name: Fremdbinaerdateien bereitlegen
        run: packaging/ci/ensure-binaries.sh

      - name: Nutzlast anlegen
        run: packaging/package.sh msix
        env:
          FERRUMPIX_BUILD_BOX: ""
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
          MSIX_VERSION: ${{ inputs.paketversion }}

      # include-hidden-files, weil die Voreinstellung Punktdateien stillschweigend weglaesst.
      - uses: actions/upload-artifact@v7
        with:
          name: msix-nutzlast
          path: packaging/work/msix/win-x64
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  msix-paket:
    name: MSIX - Packen (Windows)
    runs-on: windows-latest
    needs: msix-nutzlast

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: msix-nutzlast
          path: nutzlast

      # NICHT aus dem Windows Kits des Laeufers: dessen Pfad traegt die SDK-Fassung, und die
      # aendert sich ohne Vorwarnung. Das NuGet-Paket ist festgenagelt; check-updates.sh meldet,
      # wenn es eine neuere gibt.
      - name: makeappx bereitlegen
        shell: pwsh
        run: |
          $fassung = "10.0.28000.2705"
          $adresse = "https://api.nuget.org/v3-flatcontainer/microsoft.windows.sdk.buildtools/$fassung/microsoft.windows.sdk.buildtools.$fassung.nupkg"
          Invoke-WebRequest -Uri $adresse -OutFile sdk.zip
          Expand-Archive -Path sdk.zip -DestinationPath sdk
          $exe = Get-ChildItem -Path sdk\bin\*\x64\makeappx.exe | Select-Object -First 1
          if (-not $exe) { throw "makeappx.exe steckt nicht im Paket $fassung" }
          "MAKEAPPX=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # /o ueberschreibt ohne Rueckfrage; makeappx prueft dabei das AppxManifest.xml gegen das
      # Schema.
      - name: Packen
        shell: pwsh
        run: |
          & $env:MAKEAPPX pack /o /d nutzlast /p FerrumPix-win-x64.msix
          Get-Item FerrumPix-win-x64.msix | Format-List Name, Length

      # Von hier aus geht es von Hand ins Partner Center.
      - uses: actions/upload-artifact@v7
        with:
          name: FerrumPix-msix
          path: FerrumPix-win-x64.msix
          if-no-files-found: error

  veroeffentlichen:
    name: Ins Release
    runs-on: ubuntu-latest
    needs: [pakete, flatpak]
    # Laeuft, wenn mindestens einer der Bau-Jobs gebaut hat und KEINER gescheitert ist. Ein
    # uebersprungener Job (etwa der Flatpak bei einem Einzellauf) zaehlt nicht als Fehler.
    if: >-
      ${{ always()
          && !contains(needs.*.result, 'failure')
          && !contains(needs.*.result, 'cancelled')
          && contains(needs.*.result, 'success') }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: Bitpainter75/FerrumPix-Build
          path: packaging
          ssh-key: ${{ secrets.PACKAGING_DEPLOY_KEY }}

      - name: Werkzeuge
        run: sudo apt-get install -y jq

      # Die Artefakte der Pakete und des Flatpak in den Bauordner, wo das Skript sie erwartet. Je
      # ein Schritt mit genau einem Namen: die MSIX-Artefakte duerfen nie mit hinein. Ein Muster
      # ohne Treffer laedt nichts und ist kein Fehler - so geht es auch beim Einzellauf.
      - uses: actions/download-artifact@v8
        with:
          path: packaging/build
          pattern: pakete
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          path: packaging/build
          pattern: flatpak
          merge-multiple: true

      - name: Dateien
        run: ls -la packaging/build

      # "alle" veroeffentlicht vollstaendig und darf eine neue Version anfangen. Ein Einzellauf
      # traegt --partial: er ersetzt nur seine Dateien im bestehenden Release derselben Version
      # und bricht ab, wenn die Version neu ist.
      - name: Veroeffentlichen
        run: |
          if [ "$PAKETE" = "alle" ]; then
            packaging/publish-github-release.sh --only-packages
          else
            packaging/publish-github-release.sh --only-packages --partial
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
