# Baut libraw.dylib fuer macOS (Apple Silicon und Intel) auf echten Macs von GitHub.
#
# Vorlage fuer .github/workflows/libraw-macos.yml im OEFFENTLICHEN Repo, aus demselben Grund
# wie release.yml: dort sind die Minuten frei. Bei macOS-Laeufern wiegt das doppelt, in einem
# privaten Repo zaehlt jede macOS-Minute zehnfach gegen das Kontingent.
#
# BEWUSST NICHT TEIL DES RELEASE. Die Bibliothek wird einmal je LibRaw-Fassung gebaut, nicht bei
# jedem Paket. Ablauf:
#   1. Diesen Workflow von Hand starten.
#   2. Die beiden Artefakte herunterladen, z. B.
#        gh run download <lauf> -R Bitpainter75/FerrumPix -D /tmp/libraw-macos
#   3. libraw.dylib und HERKUNFT.txt nach packaging/libraw/osx-arm64/ und osx-x64/ legen,
#      die Pruefsummen in ci/binaries.sha256 nachziehen, im Build-Repo committen.
# Ab dann nimmt package.sh maczip sie mit, lokal wie im Release-Lauf.
#
# Jedes Ziel baut NATIV auf seiner Architektur. Nur so kann build-macos.sh am Ende die fertige
# Bibliothek laden und die RAWs aus testpaket/raws damit entwickeln - die einzige Stelle, an
# der sie ueberhaupt auf einem Mac laeuft, bevor ein Anwender sie bekommt.

name: LibRaw fuer macOS

on:
  workflow_dispatch:
    inputs:
      version:
        description: "LibRaw-Fassung (leer: die Vorgabe in build-macos.sh)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  bauen:
    name: LibRaw ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      # Nur das Build-Repo: Skript, Pruefprogramm und Test-RAWs liegen alle dort.
      - uses: actions/checkout@v7
        with:
          repository: Bitpainter75/FerrumPix-Build
          path: packaging
          ssh-key: ${{ secrets.PACKAGING_DEPLOY_KEY }}

      - name: Bauen und pruefen
        run: packaging/libraw/build-macos.sh ${{ matrix.arch }} ${{ inputs.version }}

      - uses: actions/upload-artifact@v7
        with:
          name: libraw-osx-${{ matrix.arch }}
          path: |
            packaging/libraw/osx-${{ matrix.arch }}-build/libraw.dylib
            packaging/libraw/osx-${{ matrix.arch }}-build/HERKUNFT.txt
          if-no-files-found: error
          retention-days: 14
