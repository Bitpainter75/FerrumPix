# Baut und veroeffentlicht NUR den Flatpak.
#
# Warum ein eigener Lauf: der Flatpak war im Release-Lauf mit gut vier Minuten der teuerste
# Schritt, brauchte flatpak-builder samt Laufzeitumgebung von Flathub und legte einen Bauordner
# mit Symlinks an, der dem Windows-Bau schon einmal die Aufloesung von `**/*.axaml` zerschossen
# hat. Kein anderes Paket braucht ihn, also steht er jetzt fuer sich.
#
# WANN ER LAUFEN MUSS: nach JEDER veroeffentlichten Version. Der
# Upload im Release-Lauf ersetzt nur, was im Bauordner liegt - ohne diesen Lauf bleibt die alte
# FerrumPix.flatpak im Latest-Release stehen und geht stillschweigend als aktuell durch.
#
# HIER STEHT ABSICHTLICH KEINE REIHENFOLGE-PRUEFUNG. Sie wies Laeufe ab, die richtig sind - etwa
# einen Flatpak, der allein nachgezogen wird. Und der Fall, den sie fernhalten sollte, gibt es
# nicht mehr: das Latest-Release wird nicht mehr geloescht und neu angelegt, sondern behaelt
# seine Dateien, und dieser Lauf ersetzt genau eine davon.
#
# Nur von Hand startbar, und wie bei jedem workflow_dispatch bietet GitHub den Start erst an,
# wenn die Datei im Standardzweig liegt.

name: Flatpak einzeln

on:
  workflow_dispatch:

# Zum Hochladen ins Release braucht der eingebaute Token Schreibrecht.
permissions:
  contents: write

jobs:
  flatpak:
    name: Nur Flatpak
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Das oeffentliche Repo in die Wurzel, das private nach packaging/ - genau diese Anordnung
      # erwarten die Skripte. Lesen genuegt: dieser Lauf schreibt nichts dorthin zurueck.
      - uses: actions/checkout@v7
        with:
          repository: Bitpainter75/FerrumPix-Build
          path: packaging
          ssh-key: ${{ secrets.PACKAGING_DEPLOY_KEY }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Dieselbe Zeitschranke wie im Release-Lauf: klemmt der Azure-Spiegel, wartet apt sonst
      # ohne Ende. Die Werkzeugliste ist kurz gehalten - nsis, rpm und zsync braucht nur, wer
      # die anderen Pakete baut.
      - name: Werkzeuge
        timeout-minutes: 10
        run: |
          printf 'Acquire::Retries "2";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::ForceIPv4 "true";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-release-timeouts >/dev/null
          sudo apt-get update
          sudo apt-get install -y xz-utils jq desktop-file-utils flatpak flatpak-builder

      # Version und Name muessen mit dem Manifest uebereinstimmen (runtime-version 24.08).
      #
      # DIE SDK-ERWEITERUNG GEHOERT DAZU, seit das Manifest aus Quellen baut: sie bringt das
      # .NET-SDK mit, mit dem der Bau in der Sandbox uebersetzt. Ohne sie bricht package.sh
      # gleich zu Beginn ab ("Die SDK-Erweiterung ... fehlt") - was besser ist als ein Abbruch
      # mitten im Bau, aber eben trotzdem ein Abbruch.
      - name: Flatpak-Laufzeitumgebung
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --noninteractive flathub \
            org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08 \
            org.freedesktop.Sdk.Extension.dotnet10//24.08

      # Die gebuendelte mpv-Runtime aus packaging/ci/ensure-binaries.sh entfaellt hier: sie ist
      # fuer Windows, und der Flatpak bringt libmpv ohnehin nicht mit.
      #
      # DIESER SCHRITT DAUERT, seit das Manifest aus Quellen baut: er laedt rund 843 MB
      # NuGet-Pakete und uebersetzt danach in der Sandbox, statt ein fertiges Publish
      # hineinzukopieren. Die Zeitschranke ist deshalb grosszuegig und trotzdem ein Riegel -
      # ohne sie liefe ein Haenger gegen GitHubs Sechs-Stunden-Grenze.
      - name: Paket - Flatpak
        timeout-minutes: 60
        run: packaging/package.sh flatpak
        env:
          FERRUMPIX_BUILD_BOX: ""     # der Runner ist bereits Ubuntu

      # Der Beweis, nicht die Absicht: das gebaute Bundle wird installiert und nach seinen
      # Rechten gefragt. Was im Manifest steht, ist eine Behauptung - was hier steht, ist das,
      # was auf dem Rechner des Anwenders gilt. Nach einer Aenderung an den finish-args ist das
      # die Stelle, an der man es nachliest.
      - name: Berechtigungen des Bundles zeigen
        run: |
          bundle=$(ls packaging/build/*.flatpak | head -1)
          echo "Bundle: $bundle"
          sudo flatpak install -y --noninteractive "$bundle"
          flatpak info --show-permissions io.github.Bitpainter75.FerrumPix

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: packaging/build/*.flatpak
          if-no-files-found: error

      # HIER STAND DER WEG AUF DEN WEBSERVER. Das eigene Flatpak-Repo ist am 2026-08-28 entfallen
      # (Patrick): nach jeder Version einen Ordner hochzuladen ist Arbeit, die nur einen halben Weg
      # traegt - ohne GPG-Schluessel liess sich daraus systemweit gar nicht aktualisieren, flatpak
      # verweigert den Zug aus einem unsignierten Remote. Das Ziel ist Flathub. Bis dahin ist die
      # .flatpak-Datei aus dem Release die Auslieferung, und aktualisiert wird, indem man die neue
      # Datei laedt.
      #
      # Das Repo unter packaging/work/flatpak-repo entsteht weiterhin - flatpak-builder braucht es
      # als Zwischenstand, aus dem build-bundle die Datei schnuert. Es verlaesst den Laeufer nur
      # nicht mehr.

      # Im Bauordner liegt jetzt NUR der Flatpak, und genau das ist hier richtig: das Skript
      # laedt hoch, was es findet, und ersetzt damit allein dieses eine Asset. Die uebrigen
      # Dateien des Latest-Release bleiben unberuehrt, und das Release selbst wird nie geloescht.
      - name: Ins Latest-Release
        run: packaging/publish-github-release.sh --only-latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
