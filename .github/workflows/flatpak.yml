# Vorlage. Gehoert ins OEFFENTLICHE Repo nach .github/workflows/flatpak.yml
#
# DER FLATPAK BAUT FUER SICH, NICHT FUERS RELEASE (Patrick am 2026-10-15). Ausgeliefert wird er
# ueber Flathub; dieser Lauf prueft nur, dass das eigene Manifest auf dem aktuellen Stand baut,
# und legt das Bundle als Artefakt am Lauf ab, zum Ausprobieren. Ins Release laedt er nichts.
#
# Nur Handstart, wie Release und AUR. Benoetigt PACKAGING_DEPLOY_KEY wie release.yml.

name: Flatpak

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flatpak:
    name: Flatpak bauen
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: Bitpainter75/FerrumPix-Build
          path: packaging
          ssh-key: ${{ secrets.PACKAGING_DEPLOY_KEY }}

      - name: Werkzeuge
        timeout-minutes: 10
        run: |
          printf 'Acquire::Retries "2";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::ForceIPv4 "true";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-release-timeouts >/dev/null
          sudo apt-get update
          sudo apt-get install -y xz-utils jq desktop-file-utils flatpak flatpak-builder

      # Version und Name muessen mit dem Manifest uebereinstimmen (runtime-version 26.08). Die
      # SDK-Erweiterung bringt das .NET-SDK mit, mit dem der Bau in der Sandbox uebersetzt.
      - name: Flatpak-Laufzeitumgebung
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --noninteractive flathub \
            org.freedesktop.Platform//26.08 org.freedesktop.Sdk//26.08 \
            org.freedesktop.Sdk.Extension.dotnet10//26.08

      # Er laedt die NuGet-Pakete aus nuget-sources.json und uebersetzt danach in der Sandbox,
      # ohne Netz. Die Zeitschranke ist ein Riegel gegen GitHubs Sechs-Stunden-Grenze.
      - name: Paket - Flatpak
        timeout-minutes: 60
        run: packaging/package.sh flatpak
        env:
          FERRUMPIX_BUILD_BOX: ""

      # Der Beweis, nicht die Absicht: das gebaute Bundle wird installiert und nach seinen
      # Rechten gefragt. Was im Manifest steht, ist eine Behauptung - was hier steht, gilt.
      - name: Berechtigungen des Bundles zeigen
        run: |
          bundle=$(ls packaging/build/*.flatpak | head -1)
          echo "Bundle: $bundle"
          sudo flatpak install -y --noninteractive "$bundle"
          flatpak info --show-permissions io.github.bitpainter75.ferrumpix

      - uses: actions/upload-artifact@v7
        with:
          name: flatpak
          path: packaging/build/*.flatpak
          if-no-files-found: error
          retention-days: 7
